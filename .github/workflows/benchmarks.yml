name: Benchmarks

# 1.0 headline numbers (binary size, cold start, idle RSS, the five benches) measured by `cargo xtask bench` on the
# release artifacts of a Release dry run, on one runner per OS (Linux, macOS, Windows).
#
# - workflow_dispatch: measures the artifacts of the Release run given in `release-run-id`, or of the newest
#   successful Release dry run (workflow_dispatch event, branch main) when the input is empty.
# - workflow_run: starts after a Release run finishes and measures it only when that run was a successful dry run
#   (a workflow_dispatch of Release) on main. Release runs on pull requests, tags and other branches never start a
#   measurement.
# - An explicit `release-run-id` is checked too: it must be a successful workflow_dispatch run of Release on main.
# - There is no pull_request or push trigger: this is an informational measurement, never a PR check.
#
# This workflow never builds `sqler-app` and never uses `driver-duckdb`: it measures the binaries that the Release
# workflow built and guarded (ADR-0070), and `cargo xtask bench` refuses a feature line holding `driver-duckdb`.
# Release artifacts last 7 days; when none exist, dispatch a Release dry run first.
# A breach of a budget turns the run red, after the results were uploaded.
on:
  workflow_dispatch:
    inputs:
      release-run-id:
        description: "Run id of the Release dry run whose artifacts are measured (empty: the newest successful one on main)"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows: [Release]
    types: [completed]

# One measurement at a time; a started run completes.
concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides which Release run is measured and at which commit.
  resolve:
    name: resolve the Release run
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      run-id: ${{ steps.pick.outputs.run-id }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.release-run-id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          run_id=""
          sha=""
          if [ "$EVENT" = "workflow_run" ]; then
            run_id="$WORKFLOW_RUN_ID"
            sha="$WORKFLOW_RUN_SHA"
          elif [ -n "$INPUT_RUN_ID" ]; then
            case "$INPUT_RUN_ID" in
              *[!0-9]*) echo "::error::release-run-id must be a number"; exit 1 ;;
            esac
            run_id="$INPUT_RUN_ID"
            info=$(gh run view "$run_id" --json headSha,headBranch,event,conclusion,workflowName --jq '[.workflowName,.event,.conclusion,.headBranch,.headSha] | @tsv') || {
              echo "::error::cannot read Release run $run_id"; exit 1; }
            IFS=$'\t' read -r wf_name wf_event wf_conclusion wf_branch sha <<< "$info"
            if [ "$wf_name" != "Release" ] || [ "$wf_event" != "workflow_dispatch" ] || [ "$wf_conclusion" != "success" ] || [ "$wf_branch" != "main" ]; then
              echo "::error::run $run_id is not a successful Release dry run (workflow_dispatch) on main"
              exit 1
            fi
          else
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              sha=$(gh run view "$run_id" --json headSha --jq .headSha)
            fi
          fi
          if [ -z "$run_id" ] || [ -z "$sha" ]; then
            echo "::error::no successful Release dry run found; dispatch a Release dry run first"
            exit 1
          fi
          echo "Measuring Release run $run_id at $sha"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  measure:
    name: measure (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      TARGET: ${{ matrix.target }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      # Checkout must not rewrite line endings: the guard script is read byte-exactly on Windows.
      - name: Disable line-ending conversion and enable long paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Same cache scheme as bench.yml: the default key hashes every installed rustc, which split caches at random.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          # Restore only: the benches use the cache that main runs saved.
          save-if: false
      - name: Linux system packages (benches, headless display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            libvulkan1 mesa-vulkan-drivers fonts-dejavu-core cage
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: hyperfine@2.0.0
      - name: Fetch the Release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: ${{ runner.temp }}/release
          run-id: ${{ needs.resolve.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the archive
        id: extract
        shell: bash
        run: |
          out="$RUNNER_TEMP/extracted"
          rm -rf "$out"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive=$(find "$RUNNER_TEMP/release" -type f -name "sqler-app-$TARGET.zip" | head -n 1)
            test -n "$archive"
            7z x -y -o"$(cygpath -m "$out")" "$archive" > /dev/null
            name=sqler.exe
          else
            archive=$(find "$RUNNER_TEMP/release" -type f -name "sqler-app-$TARGET.tar.xz" | head -n 1)
            test -n "$archive"
            tar -xJf "$archive" -C "$out"
            name=sqler
          fi
          bin=$(find "$out" -type f -name "$name" | head -n 1)
          test -n "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Guard (no DuckDB engine in the binary)
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: sh .github/scripts/release-guard.sh binary "$BIN"
      # The task writes its report and JSON even on a breach; the exit code is kept for the last step so the
      # results are uploaded first. On Linux the app needs a display: headless cage, as in spike.yml.
      - name: Measure (cargo xtask bench)
        id: bench
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
          ARCHIVE: ${{ steps.extract.outputs.archive }}
          RUNNER_NAME_LABEL: ${{ matrix.runner }}
        run: |
          set +e
          out="$RUNNER_TEMP/bench"
          rm -rf "$out"
          mkdir -p "$out"
          cage_pid=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            # weston --backend=headless advertises no wl_seat and GPUI panics on that; cage always creates a seat.
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            chmod 700 "$XDG_RUNTIME_DIR"
            export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1
            export WLR_HEADLESS_OUTPUTS=1
            unset DISPLAY
            cage -- sleep 7200 >"$RUNNER_TEMP/cage.log" 2>&1 &
            cage_pid=$!
            for _ in $(seq 1 30); do
              [ -S "$XDG_RUNTIME_DIR/wayland-0" ] && break
              sleep 0.5
            done
            cat "$RUNNER_TEMP/cage.log" || true
            if [ ! -S "$XDG_RUNTIME_DIR/wayland-0" ]; then
              echo "::error::the headless display did not start"
              echo "code=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            export WAYLAND_DISPLAY=wayland-0
          fi
          cargo run -q -p xtask --locked -- bench \
            --bin "$BIN" --archive "$ARCHIVE" --commit "$SHA" \
            --source ci-runner --machine "GitHub-hosted $RUNNER_NAME_LABEL" \
            --out "$out" | tee "$out/results.txt"
          code=${PIPESTATUS[0]}
          if [ -n "$cage_pid" ]; then kill "$cage_pid" 2>/dev/null; fi
          echo "xtask bench exited with $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/bench/results.txt" ]; then
            {
              echo "### Benchmarks ($TARGET)"
              echo '```'
              cat "$RUNNER_TEMP/bench/results.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmarks-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/bench/*.json
            ${{ runner.temp }}/bench/results.txt
          if-no-files-found: warn
          retention-days: 30
      # Last, so a breach (exit 1) or a measurement failure turns the run red after the upload.
      - name: Fail on a breach or a failed measurement
        if: ${{ always() && steps.bench.outputs.code != '' && steps.bench.outputs.code != '0' }}
        shell: bash
        env:
          CODE: ${{ steps.bench.outputs.code }}
        run: |
          echo "::error title=Benchmarks::xtask bench exited with $CODE (see result= and breach= lines in the summary)"
          exit "$CODE"
