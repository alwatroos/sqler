name: Bench

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  grid-viewport:
    name: grid viewport (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Baseline bench on the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          git worktree add ../base "$BASE_SHA"
          if [ -f ../base/crates/sqler-ui/benches/grid_viewport.rs ]; then
            cd ../base
            rustup toolchain install
            # Exit 1 means the base itself broke the 1 ms budget; the file is saved first.
            cargo bench -p sqler-ui --bench grid_viewport -- --reps 3 --save "$GITHUB_WORKSPACE/target/bench-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no baseline bench on base"
          fi
      - name: Bench the PR (or branch) commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/bench-base.txt" ]; then
            cargo bench -p sqler-ui --bench grid_viewport -- --reps 3 --save "$GITHUB_WORKSPACE/target/bench-pr.txt" --compare "$GITHUB_WORKSPACE/target/bench-base.txt" --slack-ns 100
          else
            cargo bench -p sqler-ui --bench grid_viewport -- --reps 3 --save "$GITHUB_WORKSPACE/target/bench-pr.txt"
          fi
      - name: Baseline catalog bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-catalog/benches/catalog_tree.rs ]; then
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no catalog baseline bench on base"
          fi
      - name: Bench the catalog on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/catalog-base.txt" ]; then
            cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-pr.txt" --compare "$GITHUB_WORKSPACE/target/catalog-base.txt"
          else
            cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-pr.txt"
          fi
      - name: Baseline catalog index bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-catalog/benches/catalog_index.rs ]; then
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no catalog index baseline bench on base"
          fi
      - name: Bench the catalog index on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/catalog-index-base.txt" ]; then
            cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-pr.txt" --compare "$GITHUB_WORKSPACE/target/catalog-index-base.txt"
          else
            cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-pr.txt"
          fi
      - name: Baseline browser tree bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-ui/benches/browser_tree.rs ]; then
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            cargo bench -p sqler-ui --bench browser_tree -- --reps 3 --save "$GITHUB_WORKSPACE/target/browser-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no browser tree baseline bench on base"
          fi
      - name: Bench the browser tree on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/browser-base.txt" ]; then
            cargo bench -p sqler-ui --bench browser_tree -- --reps 3 --save "$GITHUB_WORKSPACE/target/browser-pr.txt" --compare "$GITHUB_WORKSPACE/target/browser-base.txt" --slack-ns 250000
          else
            cargo bench -p sqler-ui --bench browser_tree -- --reps 3 --save "$GITHUB_WORKSPACE/target/browser-pr.txt"
          fi
      - name: Summary
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE/target/bench-base.txt" "$GITHUB_WORKSPACE/target/bench-pr.txt" "$GITHUB_WORKSPACE/target/catalog-base.txt" "$GITHUB_WORKSPACE/target/catalog-pr.txt" "$GITHUB_WORKSPACE/target/catalog-index-base.txt" "$GITHUB_WORKSPACE/target/catalog-index-pr.txt" "$GITHUB_WORKSPACE/target/browser-base.txt" "$GITHUB_WORKSPACE/target/browser-pr.txt"; do
            if [ -f "$f" ]; then
              echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
