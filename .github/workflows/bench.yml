name: Bench

# Runs on push to main (absolute budgets only, no base; it also saves the rust-cache that PRs restore)
# and on pull requests that touch what the benches build. Paths: every crate outside
# `cargo tree -e normal,dev,build -p sqler-ui -p sqler-catalog -p sqler-completion`, no markdown.
# The two path lists below must stay identical (no YAML anchors in workflows).
# No required_status_checks rule exists on main today, so a path-skipped run blocks nothing.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/sqler-app/**"
      - "!crates/sqler-cli/**"
      - "!crates/sqler-ai-anthropic/**"
      - "!crates/sqler-ai-mistral/**"
      - "!crates/sqler-ai-ollama/**"
      - "!crates/sqler-ai-openai/**"
      - "!crates/sqler-driver-duckdb/**"
      - "!crates/sqler-driver-mssql/**"
      - "!crates/sqler-plugin-host/**"
      - "!crates/sqler-tunnel/**"
      - "!crates/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "vendor/**"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "crates/**"
      - "!crates/sqler-app/**"
      - "!crates/sqler-cli/**"
      - "!crates/sqler-ai-anthropic/**"
      - "!crates/sqler-ai-mistral/**"
      - "!crates/sqler-ai-ollama/**"
      - "!crates/sqler-ai-openai/**"
      - "!crates/sqler-driver-duckdb/**"
      - "!crates/sqler-driver-mssql/**"
      - "!crates/sqler-plugin-host/**"
      - "!crates/sqler-tunnel/**"
      - "!crates/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "vendor/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

# Cancel superseded runs on pull requests only; every main run completes (own group per run).
concurrency:
  group: bench-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The base worktree builds into the workspace target/ (cached by rust-cache) instead of ../base/target,
  # which is never cached: its third-party dependencies come from main's cache. Path crates hash by path,
  # so base and PR artifacts do not mix. Revert: set this to ${{ github.workspace }}/../base/target.
  BASE_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  grid-viewport:
    name: grid viewport (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Saved on main only; PRs restore (they would otherwise evict main's caches).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check out the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git worktree add ../base "$BASE_SHA"
      - name: Grid viewport bench (base and PR interleaved)
        run: |
          # Same scheme as the browser tree step below: base and PR rounds alternate and each side
          # is judged by its minimum over all rounds (docs/src/benchmarks.md).
          T="$GITHUB_WORKSPACE/target"
          mkdir -p "$T"
          BASE_SRC="$GITHUB_WORKSPACE/../base/crates/sqler-ui/benches/grid_viewport.rs"
          ROUNDS=6
          BASE_ARGS=""
          HAVE_BASE=0
          if [ -f "$BASE_SRC" ]; then
            HAVE_BASE=1
            # Older base benches reject --reps (exit 2); pass it only if the base source knows it.
            if grep -q -- '--reps' "$BASE_SRC"; then BASE_ARGS="--reps 1"; fi
            # --staged (staged edits on the grid) is newer still; pass it only if the base source knows it.
            if grep -q -- '--staged' "$BASE_SRC"; then BASE_ARGS="$BASE_ARGS --staged 10000"; fi
            (cd "$GITHUB_WORKSPACE/../base" && rustup toolchain install && CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-ui --bench grid_viewport --no-run)
          else
            echo "::notice::no baseline bench on base"
          fi
          cargo bench -p sqler-ui --bench grid_viewport --no-run
          base_round() {
            # Exit 1 means the base itself broke the 1 ms budget; the file is saved first.
            (cd "$GITHUB_WORKSPACE/../base" && CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-ui --bench grid_viewport -- $BASE_ARGS --save "$T/bench-base-$1.txt") || [ $? -eq 1 ]
          }
          pr_round() {
            cargo bench -p sqler-ui --bench grid_viewport -- --reps 1 --staged 10000 --save "$T/bench-pr-$1.txt" || [ $? -eq 1 ]
          }
          JUDGE=""
          for i in $(seq 1 "$ROUNDS"); do
            if [ $((i % 2)) -eq 1 ]; then
              if [ "$HAVE_BASE" -eq 1 ]; then base_round "$i"; fi
              pr_round "$i"
            else
              pr_round "$i"
              if [ "$HAVE_BASE" -eq 1 ]; then base_round "$i"; fi
            fi
            JUDGE="$JUDGE --pr $T/bench-pr-$i.txt"
            if [ "$HAVE_BASE" -eq 1 ]; then JUDGE="$JUDGE --compare $T/bench-base-$i.txt"; fi
          done
          # Judge only: no measuring, min over the PR files against min over the base files.
          cargo bench -p sqler-ui --bench grid_viewport -- --save "$T/bench-pr.txt" $JUDGE --slack-ns 100
      - name: Baseline catalog bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-catalog/benches/catalog_tree.rs ]; then
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no catalog baseline bench on base"
          fi
      - name: Bench the catalog on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/catalog-base.txt" ]; then
            cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-pr.txt" --compare "$GITHUB_WORKSPACE/target/catalog-base.txt"
          else
            cargo bench -p sqler-catalog --bench catalog_tree -- --save "$GITHUB_WORKSPACE/target/catalog-pr.txt"
          fi
      - name: Baseline catalog index bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-catalog/benches/catalog_index.rs ]; then
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no catalog index baseline bench on base"
          fi
      - name: Bench the catalog index on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/catalog-index-base.txt" ]; then
            cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-pr.txt" --compare "$GITHUB_WORKSPACE/target/catalog-index-base.txt"
          else
            cargo bench -p sqler-catalog --bench catalog_index -- --save "$GITHUB_WORKSPACE/target/catalog-index-pr.txt"
          fi
      - name: Baseline grid sort bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f ../base/crates/sqler-ui/benches/grid_sort.rs ]; then
            # Older base benches reject --reps (exit 2); pass it only if the base source knows it.
            REPS=""
            if grep -q -- '--reps' ../base/crates/sqler-ui/benches/grid_sort.rs; then REPS="--reps 3"; fi
            cd ../base
            # Exit 1 means the base itself broke a budget; the file is saved first.
            CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-ui --bench grid_sort -- $REPS --save "$GITHUB_WORKSPACE/target/grid-sort-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no grid sort baseline bench on base"
          fi
      - name: Bench the grid sort on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/grid-sort-base.txt" ]; then
            cargo bench -p sqler-ui --bench grid_sort -- --reps 3 --save "$GITHUB_WORKSPACE/target/grid-sort-pr.txt" --compare "$GITHUB_WORKSPACE/target/grid-sort-base.txt" --sort-slack-ns 20000000 --filter-slack-ns 10000000 --viewport-slack-ns 500
          else
            cargo bench -p sqler-ui --bench grid_sort -- --reps 3 --save "$GITHUB_WORKSPACE/target/grid-sort-pr.txt"
          fi
      - name: Browser tree bench (base and PR interleaved)
        if: ${{ !cancelled() }}
        run: |
          # Shared runners swing by 2-3x between minutes, so the base and PR rounds alternate in this
          # one step and each side is judged by its minimum over all rounds (docs/src/benchmarks.md).
          T="$GITHUB_WORKSPACE/target"
          mkdir -p "$T"
          BASE_SRC="$GITHUB_WORKSPACE/../base/crates/sqler-ui/benches/browser_tree.rs"
          ROUNDS=8
          BASE_ARGS=""
          HAVE_BASE=0
          if [ -f "$BASE_SRC" ]; then
            HAVE_BASE=1
            # Older base benches reject --reps (exit 2); pass it only if the base source knows it.
            if grep -q -- '--reps' "$BASE_SRC"; then BASE_ARGS="--reps 1"; fi
            (cd "$GITHUB_WORKSPACE/../base" && rustup toolchain install && CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-ui --bench browser_tree --no-run)
          else
            echo "::notice::no browser tree baseline bench on base"
          fi
          cargo bench -p sqler-ui --bench browser_tree --no-run
          base_round() {
            # Exit 1 means the base itself broke a budget; the file is saved first.
            (cd "$GITHUB_WORKSPACE/../base" && CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-ui --bench browser_tree -- $BASE_ARGS --save "$T/browser-base-$1.txt") || [ $? -eq 1 ]
          }
          pr_round() {
            cargo bench -p sqler-ui --bench browser_tree -- --reps 1 --save "$T/browser-pr-$1.txt" || [ $? -eq 1 ]
          }
          JUDGE=""
          for i in $(seq 1 "$ROUNDS"); do
            if [ $((i % 2)) -eq 1 ]; then
              if [ "$HAVE_BASE" -eq 1 ]; then base_round "$i"; fi
              pr_round "$i"
            else
              pr_round "$i"
              if [ "$HAVE_BASE" -eq 1 ]; then base_round "$i"; fi
            fi
            JUDGE="$JUDGE --pr $T/browser-pr-$i.txt"
            if [ "$HAVE_BASE" -eq 1 ]; then JUDGE="$JUDGE --compare $T/browser-base-$i.txt"; fi
          done
          # Judge only: no measuring, min over the PR files against min over the base files.
          cargo bench -p sqler-ui --bench browser_tree -- --save "$T/browser-pr.txt" $JUDGE
      - name: Baseline completion bench on the base commit
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/../base/crates/sqler-completion/benches/completion.rs" ]; then
            cd "$GITHUB_WORKSPACE/../base"
            # Exit 1 means the base itself broke a budget; the file is saved first.
            CARGO_TARGET_DIR="$BASE_TARGET_DIR" cargo bench -p sqler-completion --bench completion -- --save "$GITHUB_WORKSPACE/target/completion-base.txt" || [ $? -eq 1 ]
          else
            echo "::notice::no completion baseline bench on base"
          fi
      - name: Bench completion on the PR (or branch) commit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target"
          if [ -f "$GITHUB_WORKSPACE/target/completion-base.txt" ]; then
            cargo bench -p sqler-completion --bench completion -- --save "$GITHUB_WORKSPACE/target/completion-pr.txt" --compare "$GITHUB_WORKSPACE/target/completion-base.txt"
          else
            cargo bench -p sqler-completion --bench completion -- --save "$GITHUB_WORKSPACE/target/completion-pr.txt"
          fi
      - name: Summary
        if: always()
        run: |
          for f in "$GITHUB_WORKSPACE"/target/bench-base-?.txt "$GITHUB_WORKSPACE/target/bench-pr.txt" "$GITHUB_WORKSPACE/target/grid-sort-base.txt" "$GITHUB_WORKSPACE/target/grid-sort-pr.txt" "$GITHUB_WORKSPACE/target/catalog-base.txt" "$GITHUB_WORKSPACE/target/catalog-pr.txt" "$GITHUB_WORKSPACE/target/catalog-index-base.txt" "$GITHUB_WORKSPACE/target/catalog-index-pr.txt" "$GITHUB_WORKSPACE"/target/browser-base-?.txt "$GITHUB_WORKSPACE/target/browser-pr.txt" "$GITHUB_WORKSPACE/target/completion-base.txt" "$GITHUB_WORKSPACE/target/completion-pr.txt"; do
            if [ -f "$f" ]; then
              echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              cat "$f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
