name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Full matrix (all OSes, all tests). Untick to run the pull request subsets."
        type: boolean
        default: true

# Only PR runs are cancelled by a newer push. A run on main (or a dispatch) has its own group, so main is never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables are enough for test backtraces and panic locations; full DWARF only makes the cache and the link step bigger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Crates a macOS PR run leaves out: pure logic, drivers, exporters and AI clients have no macOS-specific code
  # (the macOS cfg code lives in sqler-config and sqler-ui) and Linux runs them. Used as `--workspace $MAC_SKIP`.
  MAC_SKIP: >-
    --exclude sqler-sql --exclude sqler-catalog --exclude sqler-completion --exclude sqler-driver-api
    --exclude sqler-driver-sqlite --exclude sqler-driver-mysql --exclude sqler-driver-postgres
    --exclude sqler-driver-mssql --exclude sqler-export
    --exclude sqler-ai-api --exclude sqler-ai-anthropic --exclude sqler-ai-mistral
    --exclude sqler-ai-ollama --exclude sqler-ai-openai
  # DuckDB is out of v1.0 (ADR-0070, amendment 2): no workspace job compiles its bundled C++ engine. Every workspace-wide
  # cargo command uses `$WS` (the exclude) and, for clippy, `$WS_FEATURES` instead of `--all-features`, which would turn
  # on `driver-duckdb`. The `deny` job asserts WS_FEATURES lists every feature except `driver-duckdb`, so a new
  # feature cannot be forgotten. The `duckdb` job builds and tests the engine on a manual dispatch only.
  WS: --workspace --exclude sqler-driver-duckdb
  WS_FEATURES: >-
    sqler-ai-api/test-support,
    sqler-app/driver-sqlite,sqler-app/driver-postgres,sqler-app/driver-mysql,
    sqler-app/export-xlsx,sqler-app/export-parquet,
    sqler-app/ai-ollama,sqler-app/ai-anthropic,sqler-app/ai-openai,sqler-app/ai-mistral,sqler-app/plugins,sqler-app/driver-mssql,
    sqler-cli/driver-sqlite,sqler-cli/driver-postgres,sqler-cli/driver-mysql,sqler-cli/plugins,sqler-cli/driver-mssql,
    sqler-export/parquet,sqler-export/xlsx,
    sqler-plugin-host/runtime,sqler-plugin-host/cl,sqler-plugin-host/pulley-rt,sqler-plugin-host/net,
    sqler-ui/gui,sqler-ui/screenshots

# Gating rules (ADR-0068):
# - `changes` always runs and decides what is relevant. On main, on dispatch and on a PR with the label `full-ci`
#   (read at the next push) every filter is true.
# - A matrix job is never skipped with a job-level `if`: a skipped matrix job reports the unexpanded name
#   `check (${{ matrix.os }})`. It runs, skips its steps, and falls back to an ubuntu runner so the no-op costs no
#   macOS or Windows minutes.
# - A non-matrix job may use a job-level `if` (it reports `skipped`, which counts as a pass).
# - Caches are saved on main only. PRs restore them but never save, so PR code cannot write a cache main restores and
#   PR caches stop evicting main's within the 10 GB repository limit.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.out.outputs.full }}
      rust: ${{ steps.out.outputs.rust }}
      ui: ${{ steps.out.outputs.ui }}
      plugins: ${{ steps.out.outputs.plugins }}
    steps:
      # On pull_request the filter reads the changed files through the API: no checkout needed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'xtask/**'
              - 'vendor/**'
              # Compiled into sqler-app as the built-in SQL Server plugin manifest.
              - 'plugins/sqlserver/sqler.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - '.rustfmt.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/scripts/**'
            ui:
              - 'crates/sqler-ui/**'
              - 'crates/sqler-app/**'
              # Local crates sqler-ui depends on (cargo tree -e normal,dev,build -p sqler-ui -p sqler-app).
              - 'crates/sqler-acp/**'
              - 'crates/sqler-ai-api/**'
              - 'crates/sqler-ai-tools/**'
              - 'crates/sqler-catalog/**'
              - 'crates/sqler-completion/**'
              - 'crates/sqler-config/**'
              - 'crates/sqler-core/**'
              - 'crates/sqler-driver-api/**'
              - 'crates/sqler-driver-mysql/**'
              - 'crates/sqler-driver-postgres/**'
              - 'crates/sqler-driver-sqlite/**'
              - 'crates/sqler-export/**'
              - 'crates/sqler-mcp/**'
              - 'crates/sqler-plugin-api/**'
              - 'crates/sqler-sql/**'
              - 'vendor/**'
              - '.cargo/**'
              - 'docs/src/screenshots/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            plugins:
              - 'plugins/**'
              - 'xtask/**'
              - 'crates/sqler-plugin-api/**'
              - 'crates/sqler-plugin-host/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'docs/src/plugin-development/wit-reference.md'
              - '.github/workflows/ci.yml'
      - name: Resolve outputs
        id: out
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_FULL: ${{ github.event.inputs.full }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          F_RUST: ${{ steps.filter.outputs.rust }}
          F_UI: ${{ steps.filter.outputs.ui }}
          F_PLUGINS: ${{ steps.filter.outputs.plugins }}
        run: |
          # Full matrix: main, a dispatch (unless `full` is unticked, which runs the PR subsets for a timing check), the label.
          full=true
          if [ "$EVENT" = pull_request ] && [ "$FULL_LABEL" != true ]; then full=false; fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_FULL" = false ]; then full=false; fi
          # Areas: every area is relevant outside a PR; on a PR the path filter decides unless the run is full.
          pick() { if [ "$EVENT" != pull_request ] || [ "$full" = true ] || [ "$1" = true ]; then echo true; else echo false; fi; }
          {
            echo "full=$full"
            echo "rust=$(pick "$F_RUST")"
            echo "ui=$(pick "$F_UI")"
            echo "plugins=$(pick "$F_PLUGINS")"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.os }})
    needs: changes
    # No-op runs (nothing relevant changed) use an ubuntu runner instead of macOS/Windows.
    runs-on: ${{ needs.changes.outputs.rust == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.rust == 'true'
      - name: Install toolchain from rust-toolchain.toml
        if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          # check, screenshots, db and docs build the same debug tree; only this job saves it.
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages (GPUI build)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: needs.changes.outputs.rust == 'true' && runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Format
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check
      # Windows clippy runs in its own job (`clippy (windows-latest)`) in parallel with the tests; `CI result` gates on it.
      # macOS on a PR lints and tests the crates with OS-facing code only (MAC_SKIP: pure logic, drivers, exporters, AI
      # clients; Linux covers them). Main, dispatch and the label `full-ci` run everything.
      - name: Clippy
        if: needs.changes.outputs.rust == 'true' && matrix.os != 'windows-latest' && (matrix.os != 'macos-latest' || needs.changes.outputs.full == 'true')
        run: cargo clippy $WS --all-targets --features "$WS_FEATURES" -- -D warnings
      - name: Clippy (macOS PR subset)
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'macos-latest' && needs.changes.outputs.full != 'true'
        run: cargo clippy $WS $MAC_SKIP --all-targets --features "$WS_FEATURES" -- -D warnings
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          tool: cargo-nextest@0.9.148
      - name: Test
        if: needs.changes.outputs.rust == 'true' && (matrix.os == 'ubuntu-latest' || needs.changes.outputs.full == 'true')
        shell: bash
        run: cargo nextest run $WS --no-tests=pass
      - name: Test (macOS PR subset)
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'macos-latest' && needs.changes.outputs.full != 'true'
        run: cargo nextest run $WS $MAC_SKIP --no-tests=pass
      # Windows PR subset: the crates with Windows-only history (paths, processes, reserved names, CRLF, tunnels) by
      # `-p`, so the other crates' test binaries are not even built, and the two sqler-ui groups that failed only on
      # Windows. The full Windows suite runs on main, on dispatch and with the label `full-ci`.
      - name: Test (Windows PR subset)
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'windows-latest' && needs.changes.outputs.full != 'true'
        shell: bash
        run: |
          rc=0
          cargo nextest run -p sqler-plugin-host -p sqler-plugin-api -p sqler-config -p xtask -p sqler-acp -p sqler-mcp -p sqler-cli -p sqler-tunnel -p sqler-import --no-tests=pass || rc=1
          cargo nextest run -p sqler-ui -E 'test(/agent_flow/) | binary(guard_suite)' --no-tests=pass || rc=1
          exit $rc
      # The plugin host's runtime and egress layers are off by default (ADR-0057), so the workspace run above skips them.
      - name: Test (plugin host runtime and egress)
        if: needs.changes.outputs.rust == 'true'
        run: cargo nextest run -p sqler-plugin-host --features cl,net --no-tests=fail
      # The `plugins` feature of the app is off by default (ADR-0060), so the workspace run skips its code. A second
      # invocation, not `--workspace --features plugins`, which would also turn the feature on for other crates.
      # `driver-duckdb` is not tested here: DuckDB is out of v1.0 and its bundled C++ engine is built only by the
      # separate `duckdb` job (ADR-0070, amendment 2).
      - name: Test sqler-app with plugin support
        if: needs.changes.outputs.rust == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.full == 'true')
        run: cargo nextest run -p sqler-app --features plugins --no-tests=fail
      # The release feature set (dist-workspace.toml, ADR-0064) links aws-lc-rs (wasmtime) and ring (sqlx) together.
      # Running every sqler-app test with both makes a TLS test panic if `install_ring_provider` is ever lost
      # (ADR-0071). Linux only, like the other engine runs; it also covers the built-in SQL Server plugin.
      - name: Test sqler-app with the release feature set
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo nextest run -p sqler-app --features plugins,driver-mssql --no-tests=fail
      - name: Test sqler-cli with plugin support
        if: needs.changes.outputs.rust == 'true' && (matrix.os != 'windows-latest' || needs.changes.outputs.full == 'true')
        run: cargo nextest run -p sqler-cli --features plugins --no-tests=fail
      - name: Test sqler-cli with the SQL Server engine
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: cargo nextest run -p sqler-cli --features plugins,driver-mssql --no-tests=fail
      - name: Check sqler-export feature sets
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          cargo check -p sqler-export --no-default-features
          cargo check -p sqler-export --no-default-features --features parquet
          cargo check -p sqler-export --no-default-features --features xlsx

  # Clippy for Windows, split out of `check (windows-latest)` so it runs beside the tests (the Windows job was the
  # critical path). Linux and macOS keep clippy inside `check`. `CI result` makes this job part of the gate.
  clippy-windows:
    name: clippy (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          # Clippy builds the check profile, not the test tree `check` caches, so it keeps its own key.
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        shell: bash
        run: cargo clippy $WS --all-targets --features "$WS_FEATURES" -- -D warnings

  screenshots:
    name: screenshots (linux)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: debug
          save-if: false
      # The build set of `check`, plus a software Vulkan driver (lavapipe, shows up as llvmpipe)
      # and a font. No display, Xvfb or compositor: the harness opens no OS window.
      - name: Linux system packages (GPUI build, software Vulkan, fonts)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev \
            mesa-vulkan-drivers libvulkan1 fonts-dejavu-core
      - name: Render the scenes
        run: cargo test -p sqler-ui --features screenshots --test screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-linux
          path: target/screenshots
          if-no-files-found: warn

  screenshots-macos:
    name: screenshots (macos)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    # A runner without a Metal device ends the process inside GPUI, so this job may not be green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: debug
          save-if: false
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Render the scenes
        run: cargo test -p sqler-ui --features screenshots --test screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-macos
          path: target/screenshots
          if-no-files-found: warn

  db:
    name: db
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SQLER_TEST_REQUIRE_DB: postgres,mysql,ssh,mssql
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: debug
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Start PostgreSQL (TLS on)
        run: sh crates/sqler-driver-postgres/tests/docker/start-postgres.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"
      - name: Database tests
        run: cargo nextest run -p sqler-driver-postgres --no-tests=fail
      - name: Start MySQL 8.4 (TLS on)
        run: sh crates/sqler-driver-mysql/tests/docker/start-mysql.sh "$RUNNER_TEMP/mysql" mysql >> "$GITHUB_ENV"
      - name: Database tests (MySQL)
        run: cargo nextest run -p sqler-driver-mysql --no-tests=fail
      - name: CLI smoke test (MySQL)
        run: cargo run -p sqler-cli -- run --driver mysql "$SQLER_TEST_MYSQL_URL" "select 1" | grep -qx 1
      - name: Start MariaDB 11.8 (TLS on)
        run: sh crates/sqler-driver-mysql/tests/docker/start-mysql.sh "$RUNNER_TEMP/mariadb" mariadb >> "$GITHUB_ENV"
      - name: Database tests (MariaDB)
        run: cargo nextest run -p sqler-driver-mysql --no-tests=fail
      - name: CLI smoke test (MariaDB)
        run: cargo run -p sqler-cli -- run --driver mysql "$SQLER_TEST_MYSQL_URL" "select 1" | grep -qx 1
      - name: Start OpenSSH server (RSA keys)
        run: sh crates/sqler-tunnel/tests/docker/start-sshd.sh "$RUNNER_TEMP/sshd" >> "$GITHUB_ENV"
      - name: SSH tunnel tests (RSA)
        run: cargo nextest run -p sqler-tunnel --no-tests=fail
      - name: CLI smoke test (PostgreSQL)
        run: cargo run -p sqler-cli -- run --driver postgres "$SQLER_TEST_POSTGRES_URL" "select 1" | grep -qx 1
      # The image is about 1.5 GB and starts in 30-60 s (ADR-0071).
      - name: Start SQL Server 2022 (TLS forced)
        run: sh crates/sqler-driver-mssql/tests/docker/start-mssql.sh "$RUNNER_TEMP/mssql" >> "$GITHUB_ENV"
      - name: Database tests (SQL Server)
        run: cargo nextest run -p sqler-driver-mssql --no-tests=fail
      - name: Remove SQL Server container
        if: always()
        run: docker rm -f sqler-test-mssql

  # No rust-cache here: `cargo deny` and `cargo tree` compile nothing, the cache was 214 MiB of restore and save for no gain.
  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # deny.toml sets `all-features = true`, so the graph includes the DuckDB tree (licences, advisories) without compiling it.
      - name: Licenses, bans, sources, advisories
        run: cargo deny check
      # `$WS_FEATURES` replaces `--all-features` in the workspace jobs; it must list every feature but `driver-duckdb`.
      - name: Workspace feature list is complete
        env:
          WANT: ${{ env.WS_FEATURES }}
        run: |
          have=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.source == null) | .name as $n | .features | keys[] | select(. != "default" and . != "driver-duckdb") | "\($n)/\(.)"' | sort)
          want=$(printf '%s\n' "$WANT" | tr ', ' '\n\n' | grep . | sort)
          if [ "$have" != "$want" ]; then
            echo "WS_FEATURES in ci.yml differs from the workspace features (driver-duckdb excluded on purpose):"
            diff <(printf '%s\n' "$have") <(printf '%s\n' "$want") || true
            exit 1
          fi
      - name: Dependency rules
        run: |
          # Only sqler-app may depend on sqler-ui.
          test "$(cargo tree --workspace -i sqler-ui -e normal,build,dev --prefix none | awk '{print $1}' | sort -u | tr '\n' ' ')" = "sqler-app sqler-ui "
          # Exactly one GPUI: the gpui-pre fork, no upstream gpui and no gpui-ce.
          cargo tree --workspace -i gpui-pre --depth 0 >/dev/null
          if cargo tree --workspace -i gpui 2>/dev/null; then echo "upstream gpui is in the tree"; exit 1; fi
          if cargo tree --workspace -i gpui-ce 2>/dev/null; then echo "gpui-ce is in the tree"; exit 1; fi
          # The shipped binary does not link the plugin runtime until a later item turns a feature on (ADR-0054, ADR-0057).
          # `cargo tree` runs on its own so a failure of the command itself fails the step instead of passing the grep.
          tree=$(cargo tree -p sqler-app -e normal --prefix none) || { echo "cargo tree failed"; exit 1; }
          if printf '%s\n' "$tree" | grep -q '^wasmtime '; then echo "wasmtime is in the default sqler-app tree"; exit 1; fi
          # With the `plugins` feature the host must really be wired in.
          tree=$(cargo tree -p sqler-app -e normal --prefix none --features plugins) || { echo "cargo tree failed"; exit 1; }
          if ! printf '%s\n' "$tree" | grep -q '^wasmtime '; then echo "wasmtime is missing with --features plugins"; exit 1; fi
          # The DuckDB engine (a bundled C++ build) is opt-in: neither default tree has it, the feature brings it in (ADR-0070).
          for pkg in sqler-app sqler-cli; do
            tree=$(cargo tree -p "$pkg" -e normal --prefix none) || { echo "cargo tree failed"; exit 1; }
            if printf '%s\n' "$tree" | grep -q '^duckdb '; then echo "duckdb is in the default $pkg tree"; exit 1; fi
          done
          tree=$(cargo tree -p sqler-app -e normal --prefix none --features driver-duckdb) || { echo "cargo tree failed"; exit 1; }
          if ! printf '%s\n' "$tree" | grep -q '^duckdb '; then echo "duckdb is missing with --features driver-duckdb"; exit 1; fi
          # SQL Server is opt-in (ADR-0071): the default app and CLI trees do not carry tiberius.
          for pkg in sqler-app sqler-cli; do
            tree=$(cargo tree -p "$pkg" -e normal --prefix none) || { echo "cargo tree failed"; exit 1; }
            if printf '%s\n' "$tree" | grep -q '^tiberius '; then echo "tiberius is in the default $pkg tree"; exit 1; fi
          done
          # sqler-ui must stay wasmtime-free whatever the app enables.
          if cargo tree -p sqler-ui -i wasmtime 2>/dev/null; then echo "wasmtime is in the sqler-ui tree"; exit 1; fi

  plugins:
    name: plugins (${{ matrix.os }})
    needs: changes
    # No-op runs use an ubuntu runner instead of macOS/Windows.
    runs-on: ${{ needs.changes.outputs.plugins == 'true' && matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.plugins == 'true'
      - name: Install toolchain from rust-toolchain.toml
        if: needs.changes.outputs.plugins == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.plugins == 'true'
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          # The guest workspace builds into target/plugins/cargo, which the root target dir already caches.
          workspaces: . -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the plugins (debug)
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: cargo run -p xtask --locked -- plugins build
      - name: Build the plugins (release)
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: cargo run -p xtask --locked -- plugins build --release
      - name: Staged files exist
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: test -f target/plugins/release/smoke/smoke.wasm && test -f target/plugins/release/smoke/sqler.toml && test -f target/plugins/release/sqlserver/sqler.toml
      # The plugin template (plugins/template): generated outside the checkout (cargo-generate may add a crate
      # generated inside a workspace to its members), then built like a plugin developer would.
      # Built from source, pinned and locked. taiki-e/install-action has no manifest for cargo-generate and would
      # fall back to an unverified prebuilt binary. Not cached: ADR-0068 saves caches on main only, and the build
      # (about two minutes) runs only when the plugins filter is true.
      - name: Install cargo-generate (source build, locked)
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: cargo install cargo-generate --version 0.25.1 --locked
      - name: Template (generate and build)
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: |
          cargo generate --path plugins/template --name template-check --define display_name="Template check" --destination "$RUNNER_TEMP" --vcs none --silent
          cargo build --locked --release --target wasm32-wasip2 --manifest-path "$RUNNER_TEMP/template-check/Cargo.toml" --target-dir target/plugins/template
          wasm=target/plugins/template/wasm32-wasip2/release/template_check.wasm
          test -f "$wasm"
          magic=$(od -An -tx1 -N8 "$wasm" | tr -d ' \n')
          test "$magic" = "0061736d0d000100" || { echo "not a component: $magic"; exit 1; }
      - name: Template and WIT reference tests
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        run: cargo test --locked -p xtask --test template --test wit_reference
      # End-to-end: the host runs the staged debug guests. A missing fixture is a failure here, not a skip.
      - name: Guest tests (plugin host)
        if: needs.changes.outputs.plugins == 'true'
        shell: bash
        env:
          SQLER_PLUGIN_FIXTURES: target/plugins/debug
          SQLER_TEST_REQUIRE_PLUGINS: "1"
        run: cargo test --locked -p sqler-plugin-host --features cl,net --test guests
      - name: Format and clippy (Linux)
        if: needs.changes.outputs.plugins == 'true' && runner.os == 'Linux'
        shell: bash
        run: cargo run -p xtask --locked -- plugins check
      - uses: taiki-e/install-action@v2
        if: needs.changes.outputs.plugins == 'true' && runner.os == 'Linux'
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny (guest workspace, Linux)
        if: needs.changes.outputs.plugins == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo deny --manifest-path plugins/Cargo.toml --config deny.toml fetch
          cargo deny --manifest-path plugins/Cargo.toml --config deny.toml check
      - name: Clean (Linux)
        if: needs.changes.outputs.plugins == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          cargo run -p xtask --locked -- plugins clean
          test ! -e target/plugins

  docs:
    name: docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rustdoc only when Rust changed; the mdBook build below always runs.
      - name: Install toolchain from rust-toolchain.toml
        if: needs.changes.outputs.rust == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          # The default key hashes every installed rustc; some runner images carry an extra 1.99.0, which split one
          # cache into two keys and made restores miss at random. Toolchain changes still invalidate through the file hash.
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: debug
          save-if: false
      - name: Linux system packages (GPUI build)
        if: needs.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - name: rustdoc
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc $WS --no-deps --document-private-items
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: mdBook
        run: mdbook build docs

  # The only job that compiles the bundled DuckDB C++ engine (ADR-0070, amendment 2: DuckDB is out of v1.0). It runs on
  # a manual dispatch only (never on pull_request or push, so it cannot block a merge). It is not in `needs` of
  # `CI result` and must never be a required check. One C++ engine build (one clippy and one test run on one feature
  # set). Linux only.
  duckdb:
    name: duckdb
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          add-rust-environment-hash-key: false
          key: tc-${{ hashFiles('rust-toolchain.toml') }}
          shared-key: duckdb
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Linux system packages (GPUI build)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # One feature set for every step, so the bundled C++ engine is compiled once and reused by the test build.
      - name: Clippy (engine, app and cli with driver-duckdb)
        run: cargo clippy -p sqler-driver-duckdb -p sqler-app -p sqler-cli --all-targets --features sqler-app/driver-duckdb,sqler-cli/driver-duckdb -- -D warnings
      - name: Tests (engine, app and cli with driver-duckdb)
        run: cargo nextest run -p sqler-driver-duckdb -p sqler-app -p sqler-cli --features sqler-app/driver-duckdb,sqler-cli/driver-duckdb --no-tests=fail

  spdx:
    name: spdx
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: SPDX headers
        run: sh .github/scripts/check-spdx.sh

  # One result for the whole workflow. A failed or cancelled job fails it; `skipped` (path-gated) passes.
  # `screenshots (macos)` is advisory (continue-on-error) and left out on purpose.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, check, clippy-windows, screenshots, db, deny, plugins, docs, spdx]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "a job ended as $r"; exit 1 ;; esac
          done
          test "$CHANGES" = success
