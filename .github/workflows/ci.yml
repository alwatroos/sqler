name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Test
        run: cargo nextest run --workspace --no-tests=pass

  db:
    name: db
    runs-on: ubuntu-latest
    env:
      SQLER_TEST_REQUIRE_DB: postgres,mysql,ssh
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      - name: Start PostgreSQL (TLS on)
        run: sh crates/sqler-driver-postgres/tests/docker/start-postgres.sh "$RUNNER_TEMP/pg" >> "$GITHUB_ENV"
      - name: Database tests
        run: cargo nextest run -p sqler-driver-postgres --no-tests=fail
      - name: Start MySQL 8.4 (TLS on)
        run: sh crates/sqler-driver-mysql/tests/docker/start-mysql.sh "$RUNNER_TEMP/mysql" mysql >> "$GITHUB_ENV"
      - name: Database tests (MySQL)
        run: cargo nextest run -p sqler-driver-mysql --no-tests=fail
      - name: CLI smoke test (MySQL)
        run: cargo run -p sqler-cli -- run --driver mysql "$SQLER_TEST_MYSQL_URL" "select 1" | grep -qx 1
      - name: Start MariaDB 11.8 (TLS on)
        run: sh crates/sqler-driver-mysql/tests/docker/start-mysql.sh "$RUNNER_TEMP/mariadb" mariadb >> "$GITHUB_ENV"
      - name: Database tests (MariaDB)
        run: cargo nextest run -p sqler-driver-mysql --no-tests=fail
      - name: CLI smoke test (MariaDB)
        run: cargo run -p sqler-cli -- run --driver mysql "$SQLER_TEST_MYSQL_URL" "select 1" | grep -qx 1
      - name: Start OpenSSH server (RSA keys)
        run: sh crates/sqler-tunnel/tests/docker/start-sshd.sh "$RUNNER_TEMP/sshd" >> "$GITHUB_ENV"
      - name: SSH tunnel tests (RSA)
        run: cargo nextest run -p sqler-tunnel --no-tests=fail
      - name: CLI smoke test (PostgreSQL)
        run: cargo run -p sqler-cli -- run --driver postgres "$SQLER_TEST_POSTGRES_URL" "select 1" | grep -qx 1

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Licenses, bans, sources, advisories
        run: cargo deny check
      - name: Dependency rules
        run: |
          # Only sqler-app may depend on sqler-ui.
          test "$(cargo tree --workspace -i sqler-ui -e normal,build,dev --prefix none | awk '{print $1}' | sort -u | tr '\n' ' ')" = "sqler-app sqler-ui "
          # Exactly one GPUI: the gpui-pre fork, no upstream gpui and no gpui-ce.
          cargo tree --workspace -i gpui-pre --depth 0 >/dev/null
          if cargo tree --workspace -i gpui 2>/dev/null; then echo "upstream gpui is in the tree"; exit 1; fi
          if cargo tree --workspace -i gpui-ce 2>/dev/null; then echo "gpui-ce is in the tree"; exit 1; fi

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: mdBook
        run: mdbook build docs

  spdx:
    name: spdx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SPDX headers
        run: sh .github/scripts/check-spdx.sh
