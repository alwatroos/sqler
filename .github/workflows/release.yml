name: Release

# Release pipeline (ADR-0064): cargo-dist builds and packages `sqler-app`; a `v*` tag publishes a GitHub Release.
# Started from `dist generate` and now maintained by hand (`allow-dirty = ["ci"]` in dist-workspace.toml): the
# path-gated PR trigger, the dry run, the GPUI setup, the DuckDB guard before every upload, the smoke run and the
# size line cannot be generated. After a dist upgrade, run `dist generate` into a scratch copy and diff it.
#
# - Pull request touching a release file: plan, guard and a Linux x86_64 build (uploaded as a workflow artifact, 7
#   days). The label `full-ci` (read when the run starts; push again after labelling) adds every OS, the global
#   artifacts and the SBOM.
# - workflow_dispatch on a branch: always a full dry run, never publishes. It needs this file on the default branch.
# - Tag `vX.Y.Z` (a tag push, or a workflow_dispatch on the tag ref): the full run, then `host` creates the GitHub
#   Release. Nothing else ever publishes.
# tag-dispatch: a workflow_dispatch on a refs/tags/v* ref publishes like a tag push (R18).
#   The "Tag release" workflow creates the tag with GITHUB_TOKEN, which does not trigger the tag push, so it
#   dispatches this workflow on the tag instead. The tag is derived from GITHUB_REF in the `mode` step, checked
#   against the workspace version and passed to dist explicitly.
# - `sign (macOS)` (ADR-0065) runs on `v*` tag runs only, in the environment `release`, between `build` and `global`: it
#   signs and notarises the macOS archives with the six APPLE_* secrets (fails if one is missing) and re-uploads them;
#   `global` hashes after it.
# - `update manifest` (ADR-0066, R5) runs on `v*` tag runs only, in the environment `release`: it signs sqler-update.json with
#   SQLER_UPDATE_SIGNING_KEY (when set) and `host` attaches it to the release. `update manifest (dry run)` runs the
#   same path on PRs and dispatch with a TEST ONLY key it generates itself, no secret, and publishes nothing.
# - Installers (ADR-0075), built inside each `build` job from the extracted archive: macOS `.dmg` (drag to Applications,
#   ad-hoc signed, never notarised), Linux `.deb` (dpkg-deb), Windows `.msi` (cargo-dist, with a Start menu shortcut).
#   Each is installed or mounted and run in CI (packaging/*/check-*); `global` adds the `.dmg` and `.deb` hashes to
#   sha256.sum. The update manifest still covers the archives only.
#
# The release feature set is the single `features = [...]` line in dist-workspace.toml, set per owner decision 12
# (ADR-0064 amendment). `release-guard.sh` rejects `driver-duckdb` whatever that line holds (ADR-0070).
on:
  pull_request:
    paths:
      - "dist-workspace.toml"
      - ".github/workflows/release.yml"
      - ".github/scripts/release-guard.sh"
      - ".github/scripts/sign-macos.sh"
      - "packaging/**"
      - "crates/sqler-app/Cargo.toml"
      - "crates/sqler-app/wix/**"
      - "about.toml"
      - "about.hbs"
      - "NOTICE"
      - "licenses/**"
      - ".github/scripts/third-party-licenses.sh"
      - "xtask/src/release/**"
      - "crates/sqler-update/keys/**"
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Cancel superseded runs on pull requests only; a branch dispatch run completes (own group per run), as in size.yml.
# A run on a tag ref (push or dispatch) shares one group per tag, so two runs on the same tag never overlap.
concurrency:
  group: release-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs `dist plan` (or `dist host --steps=create` on a tag) to decide what to build.
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.mode.outputs.tag }}
      tag-flag: ${{ steps.mode.outputs.tag-flag }}
      publishing: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISHING: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') }}
      FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      # taiki-e/install-action has no manifest for cargo-dist; build the version pinned in dist-workspace.toml.
      - name: Install dist
        shell: bash
        run: |
          ver=$(sed -n 's/^cargo-dist-version *= *"\([^"]*\)".*/\1/p' dist-workspace.toml)
          test -n "$ver"
          # Outside the repository, so rust-toolchain.toml does not select the toolchain for the tool build.
          cd "$RUNNER_TEMP"
          cargo install --locked --version "$ver" --root "$RUNNER_TEMP/dist" cargo-dist
          echo "$RUNNER_TEMP/dist/bin" >> "$GITHUB_PATH"
      - name: Cache dist for the Linux jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist/bin/dist
          retention-days: 1
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-about@0.9.2
      # R14: generated once, here, so every target and installer ships the same bytes. Before `dist plan`, which
      # checks that the `include` files exist. The script rejects driver-duckdb and any DuckDB text in the output.
      - name: Third-party licences
        shell: bash
        run: sh .github/scripts/third-party-licenses.sh THIRD-PARTY-LICENSES.txt
      - name: Upload the third-party licences
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt
          retention-days: 7
      - id: mode
        shell: bash
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            tag=${GITHUB_REF#refs/tags/}
            if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error title=Release tag::the tag is not vX.Y.Z[-pre]"
              exit 1
            fi
            version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)
            if [ -z "$version" ] || [ "${tag#v}" != "$version" ]; then
              echo "::error title=Release tag::the tag does not match the workspace version in Cargo.toml"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "tag-flag=--tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "tag-flag=" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        shell: bash
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            dist host --steps=create --tag="$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          # A PR without the label `full-ci` builds Linux x86_64 only; the uploaded plan keeps the full matrix.
          if [ "$FULL" = "true" ]; then
            echo "manifest=$(jq -c '.' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          else
            echo "manifest=$(jq -c '.ci.github.artifacts_matrix.include |= map(select(.targets | index("x86_64-unknown-linux-gnu")))' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json
          retention-days: 7

  # Fails before any build when the release configuration could ship the DuckDB engine (ADR-0070).
  guard:
    name: guard (features)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Release features and dependency tree
        shell: bash
        run: sh .github/scripts/release-guard.sh features

  # Builds and packages the platform-specific artifacts, one job per target: the archive (and the MSI on Windows) from
  # cargo-dist, plus the .dmg on macOS and the .deb on Linux from packaging/ (ADR-0075).
  build:
    name: build (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
      - guard
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The matrix (runner, targets, dist-args) is computed by dist in the plan job.
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET: ${{ matrix.targets[0] }}
      TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      DIST_ARGS: ${{ matrix.dist_args }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      # Checkout must not rewrite line endings: the guard script and the wxs are read byte-exactly on Windows.
      - name: Disable line-ending conversion and enable long paths
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev dpkg-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Fetch the dist built by the plan job
        if: matrix.runner == 'ubuntu-22.04'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-cache
      - name: Use the cached dist
        if: matrix.runner == 'ubuntu-22.04'
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/dist-cache/dist"
          echo "$RUNNER_TEMP/dist-cache" >> "$GITHUB_PATH"
      - name: Install dist
        if: matrix.runner != 'ubuntu-22.04'
        shell: bash
        run: |
          ver=$(sed -n 's/^cargo-dist-version *= *"\([^"]*\)".*/\1/p' dist-workspace.toml)
          test -n "$ver"
          cd "$RUNNER_TEMP"
          cargo install --locked --version "$ver" --root "$RUNNER_TEMP/dist" cargo-dist
          bin="$RUNNER_TEMP/dist/bin"
          if command -v cygpath >/dev/null 2>&1; then bin=$(cygpath -w "$bin"); fi
          echo "$bin" >> "$GITHUB_PATH"
      # R14: the file generated once in the plan job; cargo-dist's `include` puts it into the archive and the MSI.
      - name: Fetch the third-party licences
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: third-party-licenses
          path: .
      - name: Build artifacts
        shell: bash
        run: |
          # shellcheck disable=SC2086 # TAG_FLAG and DIST_ARGS are flag lists
          dist build $TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - name: Guard (no DuckDB build output)
        shell: bash
        run: sh .github/scripts/release-guard.sh build-dir "target/$TARGET/dist"
      - name: Extract the archive
        id: extract
        shell: bash
        run: |
          out="$RUNNER_TEMP/extracted"
          rm -rf "$out"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="target/distrib/sqler-app-$TARGET.zip"
            7z x -y -o"$(cygpath -m "$out")" "$archive" > /dev/null
            name=sqler.exe
          else
            archive="target/distrib/sqler-app-$TARGET.tar.xz"
            tar -xJf "$archive" -C "$out"
            name=sqler
          fi
          bin=$(find "$out" -type f -name "$name" | head -n 1)
          test -n "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Guard (no DuckDB engine in the binary)
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: sh .github/scripts/release-guard.sh binary "$BIN"
      # R14: the licence bundle sits next to the binary in the archive, and in the MSI on Windows.
      - name: Licence bundle
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: |
          dir=$(dirname "$BIN")
          for f in LICENSE NOTICE THIRD-PARTY-LICENSES.txt licenses/LUCIDE-ISC.txt; do
            if [ ! -s "$dir/$f" ]; then
              echo "::error title=Licence bundle::$f is missing from the archive"
              exit 1
            fi
          done
          echo "archive bundle ok: $dir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            msi=$(find target/distrib -name '*.msi' | head -n 1)
            test -n "$msi"
            sh .github/scripts/msi-licence-check.sh "$msi"
          fi
      # Windows builds the GUI subsystem, so the output goes to a file instead of the console.
      - name: Smoke check (--version)
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: |
          "$BIN" --version > "$RUNNER_TEMP/version.txt" 2>&1
          cat "$RUNNER_TEMP/version.txt"
          grep -Eq '^sqler [0-9]' "$RUNNER_TEMP/version.txt"
      # ADR-0075: the .dmg and the .deb are built from the extracted archive, then installed or mounted and run.
      # The MSI is cargo-dist's; it is installed, checked and removed here. The check scripts change the host (CI only).
      - name: Installer (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)
          test -n "$version"
          sh packaging/macos/build-dmg.sh "$(dirname "$BIN")" "$version" "$TARGET" target/distrib
          sh packaging/macos/check-dmg.sh "target/distrib/sqler-app-$TARGET.dmg"
      - name: Installer (.deb)
        if: runner.os == 'Linux'
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n 1)
          test -n "$version"
          sh packaging/linux/build-deb.sh "$(dirname "$BIN")" "$version" "$TARGET" target/distrib
          sh packaging/linux/check-deb.sh "target/distrib/sqler-app-$TARGET.deb"
      - name: Installer check (.msi)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/distrib -Filter *.msi | Select-Object -First 1
          if (-not $msi) { Write-Host '::error title=Installer::no .msi in target/distrib'; exit 1 }
          pwsh -NoProfile -File packaging/windows/check-msi.ps1 -Msi $msi.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Report only, never a gate (ADR-0069: budget 80 MB = 83,886,080 bytes).
      - name: Size report
        shell: bash
        env:
          BIN: ${{ steps.extract.outputs.bin }}
          ARCHIVE: ${{ steps.extract.outputs.archive }}
        run: |
          budget=83886080
          bin_bytes=$(wc -c < "$BIN" | tr -d ' ')
          archive_bytes=$(wc -c < "$ARCHIVE" | tr -d ' ')
          line="sqler release on $RUNNER_OS ($TARGET): binary $bin_bytes bytes, archive $archive_bytes bytes (budget 80 MB = $budget bytes)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bin_bytes" -gt "$budget" ]; then
            echo "::warning title=Binary size::sqler on $RUNNER_OS is $bin_bytes bytes, over the 80 MB budget"
          fi
      # No secret here: this job also runs on pull requests. Signing happens in `sign (macOS)` (ADR-0065).
      - name: macOS signing (ADR-0065)
        if: runner.os == 'macOS'
        shell: bash
        env:
          PUBLISHING: ${{ needs.plan.outputs.publishing }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            echo "::notice title=macOS signing::signed and notarised in sign (macOS) (ADR-0065)"
          else
            echo "::notice title=Unsigned macOS build::dry run; the archives of this run are unsigned, signing runs only on v* tag runs (ADR-0065)"
          fi
      - id: cargo-dist
        name: Collect the upload list
        shell: bash
        run: |
          # Parse out what was built and upload it to scratch storage.
          # ADR-0075: the installers built by packaging/ are not in dist's manifest; add each with its sidecar.
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            for ext in dmg deb; do
              for f in "target/distrib/sqler-app-$TARGET.$ext" "target/distrib/sqler-app-$TARGET.$ext.sha256"; do
                if [ -f "$f" ]; then
                  echo "$f"
                fi
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Guard (no DuckDB in the artifacts)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts target/distrib
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 7

  # Signs and notarises the two macOS archives (ADR-0065). The only job that reads the six APPLE_* secrets, and it runs
  # on a `v*` tag run (push, or dispatch on the tag) only, in the environment `release` (deployment rule: tags `v*`; it
  # also holds the update signing key). It FAILS if any of the six secrets is missing or if signing or notarisation
  # fails, so nothing publishes (fail closed). There is no unsigned fallback: macOS is never published unsigned.
  sign-macos:
    name: sign (macOS)
    needs:
      - plan
      - build
    if: ${{ needs.plan.outputs.publishing == 'true' }}
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Only whether each secret exists is exposed to this step, never its value.
      - id: secrets
        name: Check the Apple secrets
        shell: bash
        env:
          HAS_APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
          HAS_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID != '' }}
          HAS_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 != '' }}
        run: |
          missing=""
          for n in APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8_BASE64; do
            eval "v=\$HAS_$n"
            [ "$v" = "true" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Apple secrets missing::${missing# } not set in environment release; macOS is never published unsigned (ADR-0065)"
            exit 1
          fi
      - name: Fetch the arm64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-local-aarch64-apple-darwin
          path: ${{ runner.temp }}/macos/aarch64-apple-darwin
      - name: Fetch the x86_64 archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-build-local-x86_64-apple-darwin
          path: ${{ runner.temp }}/macos/x86_64-apple-darwin
      - id: sign-arm64
        name: Sign and notarise (aarch64)
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          DIR: ${{ runner.temp }}/macos/aarch64-apple-darwin
          TARGET: aarch64-apple-darwin
        run: sh .github/scripts/sign-macos.sh "$DIR/sqler-app-$TARGET.tar.xz" "$DIR/$TARGET-dist-manifest.json"
      - id: sign-x64
        name: Sign and notarise (x86_64)
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          DIR: ${{ runner.temp }}/macos/x86_64-apple-darwin
          TARGET: x86_64-apple-darwin
        run: sh .github/scripts/sign-macos.sh "$DIR/sqler-app-$TARGET.tar.xz" "$DIR/$TARGET-dist-manifest.json"
      # Each signed archive is checked again from the files that will be uploaded, then replaces the build artifact.
      - name: Verify the signed aarch64 archive
        shell: bash
        env:
          DIR: ${{ runner.temp }}/macos/aarch64-apple-darwin
          TARGET: aarch64-apple-darwin
        run: |
          out="$RUNNER_TEMP/verify-$TARGET"
          rm -rf "$out"
          mkdir -p "$out"
          tar -xJf "$DIR/sqler-app-$TARGET.tar.xz" -C "$out"
          bin=$(find "$out" -type f -name sqler | head -n 1)
          test -n "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv --verbose=2 "$bin" 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\(.*runtime'
          codesign -d --entitlements - --xml "$bin" 2>/dev/null | grep -q 'com.apple.security.cs.allow-unsigned-executable-memory'
          sh .github/scripts/release-guard.sh binary "$bin"
          "$bin" --version | grep -Eq '^sqler [0-9]'
          (cd "$DIR" && shasum -a 256 -c "sqler-app-$TARGET.tar.xz.sha256")
          sh .github/scripts/release-guard.sh artifacts "$DIR"
      - name: Verify the signed x86_64 archive
        shell: bash
        env:
          DIR: ${{ runner.temp }}/macos/x86_64-apple-darwin
          TARGET: x86_64-apple-darwin
        run: |
          out="$RUNNER_TEMP/verify-$TARGET"
          rm -rf "$out"
          mkdir -p "$out"
          tar -xJf "$DIR/sqler-app-$TARGET.tar.xz" -C "$out"
          bin=$(find "$out" -type f -name sqler | head -n 1)
          test -n "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -dv --verbose=2 "$bin" 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\(.*runtime'
          codesign -d --entitlements - --xml "$bin" 2>/dev/null | grep -q 'com.apple.security.cs.allow-unsigned-executable-memory'
          sh .github/scripts/release-guard.sh binary "$bin"
          (cd "$DIR" && shasum -a 256 -c "sqler-app-$TARGET.tar.xz.sha256")
          sh .github/scripts/release-guard.sh artifacts "$DIR"
      - name: Upload the signed aarch64 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-aarch64-apple-darwin
          path: ${{ runner.temp }}/macos/aarch64-apple-darwin/*
          overwrite: true
          retention-days: 7
      - name: Upload the signed x86_64 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-x86_64-apple-darwin
          path: ${{ runner.temp }}/macos/x86_64-apple-darwin/*
          overwrite: true
          retention-days: 7

  # Platform-agnostic artifacts: the unified checksum file, the source archive, the installers and the SBOM.
  global:
    name: global artifacts
    needs:
      - plan
      - build
      - sign-macos
    if: ${{ always() && needs.plan.result == 'success' && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') && needs.plan.outputs.full == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Fetch the dist built by the plan job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-cache
      - name: Use the cached dist
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/dist-cache/dist"
          echo "$RUNNER_TEMP/dist-cache" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-cyclonedx@0.5.9
      # The local artifacts are needed for the checksums.
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          # shellcheck disable=SC2086 # TAG_FLAG is a flag
          dist build $TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      # ADR-0075: the .dmg and .deb files and the MSI must all be here; their sidecars verify; their hashes join sha256.sum
      # (dist's own list covers the archives only), which `host` publishes through its artifacts/* glob.
      - name: Installer checksums
        shell: bash
        run: |
          cd target/distrib
          files=""
          for t in aarch64-apple-darwin x86_64-apple-darwin; do files="$files sqler-app-$t.dmg"; done
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do files="$files sqler-app-$t.deb"; done
          for f in $files sqler-app-x86_64-pc-windows-msvc.msi; do
            if [ ! -f "$f" ]; then
              echo "::error title=Installer::$f is missing from the build artifacts"
              exit 1
            fi
          done
          for f in $files; do
            sha256sum -c "$f.sha256"
          done
          # shellcheck disable=SC2086 # $files is a list of plain names
          sha256sum $files >> sha256.sum
          cat sha256.sum
      # R14: one SBOM per target (the Windows .zip and .msi share one), for the shipped package only. Each uses the
      # feature list of dist-workspace.toml, so it describes what is shipped for that target.
      - id: cargo-cyclonedx
        name: SBOM
        shell: bash
        run: |
          feats=$(sed -n 's/^features *= *\[\([^]]*\)\].*/\1/p' dist-workspace.toml | tr -d '" ')
          targets=$(sed -n 's/^targets *= *\[\([^]]*\)\].*/\1/p' dist-workspace.toml | tr -d '" ' | tr ',' ' ')
          test -n "$targets"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          for t in $targets; do
            if [ -n "$feats" ]; then
              cargo cyclonedx -v --manifest-path crates/sqler-app/Cargo.toml --features "$feats" --target "$t" --target-in-filename
            else
              cargo cyclonedx -v --manifest-path crates/sqler-app/Cargo.toml --target "$t" --target-in-filename
            fi
            # Keep sqler-app_<target>.cdx.xml only, and move it next to the other artifacts.
            find . -name '*.cdx.xml' ! -name 'sqler-app_*' -delete
            find . -name "sqler-app_$t.cdx.xml" -not -path './target/distrib/*' -exec mv '{}' target/distrib/ ';'
            test -f "target/distrib/sqler-app_$t.cdx.xml"
            echo "target/distrib/sqler-app_$t.cdx.xml" >> "$GITHUB_OUTPUT"
          done
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Guard (no DuckDB in the artifacts)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts target/distrib
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ steps.cargo-cyclonedx.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          retention-days: 7

  # Update manifest dry run (R5, ADR-0066): pull requests and dispatch. No environment, no secret: it signs with a
  # TEST ONLY key generated inside the job, which is not compiled into the client. The result is an Actions artifact
  # named TEST-ONLY and is never a release asset.
  manifest-dry-run:
    name: update manifest (dry run)
    needs:
      - plan
      - guard
      - build
      - sign-macos
    if: ${{ always() && needs.plan.outputs.publishing != 'true' && needs.plan.result == 'success' && needs.guard.result == 'success' && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || needs.sign-macos.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Build xtask
        shell: bash
        run: cargo build -p xtask --locked
      - name: Fetch the dist plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-plan-dist-manifest
          path: ${{ runner.temp }}/plan
      - name: Fetch the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Guard (no DuckDB in the artifacts)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts "$RUNNER_TEMP/dist"
      - name: Build and test-sign the manifest
        shell: bash
        env:
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          umask 077
          key="$RUNNER_TEMP/test-signing-key"
          trap 'rm -f "$key"' EXIT
          head -c 32 /dev/urandom | base64 -w0 > "$key"
          partial=""
          if [ "$FULL" != "true" ]; then partial="--partial"; fi
          out="$RUNNER_TEMP/update-manifest-test"
          mkdir -p "$out"
          published=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # shellcheck disable=SC2086 # partial is empty or one flag
          target/debug/xtask release manifest --plan "$RUNNER_TEMP/plan/plan-dist-manifest.json" \
            --artifacts "$RUNNER_TEMP/dist" --published "$published" \
            --key-file "$key" --test-key $partial \
            --out "$out/sqler-update.TEST-ONLY.json"
          echo "::notice title=Update manifest (dry run)::signed with a TEST ONLY key generated in this job; not a release asset"
      - name: Guard (no DuckDB in the manifest output)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts "$RUNNER_TEMP/update-manifest-test"
      - name: Upload the TEST ONLY manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: update-manifest-TEST-ONLY
          path: ${{ runner.temp }}/update-manifest-test/sqler-update.TEST-ONLY.json
          retention-days: 7

  # Signs the update manifest (R5, ADR-0066) on a `v*` tag run (push, or dispatch on the tag) only, in the environment `release` (deployment rule:
  # tags `v*`). The only job that reads SQLER_UPDATE_SIGNING_KEY. xtask is built BEFORE any step can see the secret
  # and the signing step runs the prebuilt binary, so no build script runs while the key exists. `host` attaches the
  # result to the release when it creates it. Without the secret the release simply carries no manifest.
  manifest:
    name: update manifest
    needs:
      - plan
      - guard
      - build
      - sign-macos
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.plan.result == 'success' && needs.guard.result == 'success' && needs.build.result == 'success' && needs.sign-macos.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.done.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Build xtask
        shell: bash
        run: cargo build -p xtask --locked
      - name: Fetch the dist plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-plan-dist-manifest
          path: ${{ runner.temp }}/plan
      - name: Fetch the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-build-local-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Guard (no DuckDB in the artifacts)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts "$RUNNER_TEMP/dist"
      # Only whether the secret exists is exposed to this step, never its value.
      - id: secret
        name: Check the update signing key
        shell: bash
        env:
          HAVE_KEY: ${{ secrets.SQLER_UPDATE_SIGNING_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Update manifest::no SQLER_UPDATE_SIGNING_KEY; the release carries no update manifest"
          fi
      - id: sign
        name: Build and sign the manifest
        if: steps.secret.outputs.present == 'true'
        shell: bash
        env:
          SQLER_UPDATE_SIGNING_KEY: ${{ secrets.SQLER_UPDATE_SIGNING_KEY }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          umask 077
          key="$RUNNER_TEMP/update-signing-key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SQLER_UPDATE_SIGNING_KEY" > "$key"
          unset SQLER_UPDATE_SIGNING_KEY
          out="$RUNNER_TEMP/update-manifest"
          mkdir -p "$out"
          published=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          target/debug/xtask release manifest --plan "$RUNNER_TEMP/plan/plan-dist-manifest.json" \
            --artifacts "$RUNNER_TEMP/dist" --published "$published" --tag "$TAG" \
            --key-file "$key" --out "$out/sqler-update.json"
      # An independent check against the compiled-in key, from the file that will be uploaded.
      - name: Verify the signed manifest
        if: steps.secret.outputs.present == 'true'
        shell: bash
        run: target/debug/xtask release verify "$RUNNER_TEMP/update-manifest/sqler-update.json"
      - name: Guard (no DuckDB in the manifest output)
        if: steps.secret.outputs.present == 'true'
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts "$RUNNER_TEMP/update-manifest"
      - name: Upload the signed manifest
        if: steps.secret.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: update-manifest
          path: ${{ runner.temp }}/update-manifest/sqler-update.json
          retention-days: 7
      - id: done
        name: Report
        shell: bash
        env:
          PRESENT: ${{ steps.secret.outputs.present }}
        run: echo "signed=$PRESENT" >> "$GITHUB_OUTPUT"

  # Publishes the GitHub Release. Runs on a `v*` tag run only (publishing), after every build and the global artifacts.
  host:
    name: host
    needs:
      - plan
      - guard
      - build
      - sign-macos
      - global
      - manifest
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.plan.result == 'success' && needs.guard.result == 'success' && needs.build.result == 'success' && needs.sign-macos.result == 'success' && needs.global.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch the dist built by the plan job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ${{ runner.temp }}/dist-cache
      - name: Use the cached dist
        shell: bash
        run: |
          chmod +x "$RUNNER_TEMP/dist-cache/dist"
          echo "$RUNNER_TEMP/dist-cache" >> "$GITHUB_PATH"
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Guard (no DuckDB in the artifacts)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts target/distrib
      - id: host
        shell: bash
        run: |
          # shellcheck disable=SC2086 # TAG_FLAG is a flag
          dist host $TAG_FLAG --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Overwrite the previous copy.
          name: artifacts-dist-manifest
          path: dist-manifest.json
          retention-days: 7
      - name: Download GitHub artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        shell: bash
        run: |
          # Remove the granular manifests.
          rm -f artifacts/*-dist-manifest.json
      # The signed update manifest (R5) is part of the release from the moment it is created, so the feed URL never
      # points at a release that lacks it. Its artifact name does not match `artifacts-*`, so `dist host` never saw it.
      - name: Fetch the signed update manifest
        if: needs.manifest.outputs.signed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: update-manifest
          path: artifacts
      - name: Guard (no DuckDB in the release files)
        shell: bash
        run: sh .github/scripts/release-guard.sh artifacts artifacts
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          # Write and read notes from a file to avoid quoting breaking things.
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          # shellcheck disable=SC2086 # PRERELEASE_FLAG is empty or one flag
          gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
      - name: Check the update manifest is a release asset
        if: needs.manifest.outputs.signed == 'true'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx sqler-update.json

  announce:
    name: announce
    needs:
      - plan
      - host
    if: ${{ always() && needs.plan.outputs.publishing == 'true' && needs.host.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
