name: Binary size

# Reports the release `sqler` size per OS next to the 60 MB budget. Report only, never a gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - ".github/workflows/size.yml"

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build release binary
        run: cargo build --release -p sqler-app --locked
      - name: Report size
        shell: bash
        run: |
          bin=target/release/sqler
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/release/sqler.exe; fi
          bytes=$(wc -c < "$bin" | tr -d ' ')
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          budget=62914560
          line="sqler release binary on $RUNNER_OS: $bytes bytes = $mib MiB (budget 60 MB = $budget bytes; report only, not a gate)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::warning title=Binary size::sqler on $RUNNER_OS is $bytes bytes ($mib MiB), over the 60 MB budget"
          fi
      # Diagnostics, report only (never a gate). The release profile strips symbols, so the section table
      # comes from the shipped binary and the per-crate table from a separate unstripped build.
      - name: Report top sections
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          # Sort to a temp file, then head: no pipe to a closing reader, so no SIGPIPE under pipefail.
          # The trap closes the code fence even when a command above fails.
          tmp="$RUNNER_TEMP/sections.txt"
          {
            echo ""
            echo "### Largest sections (size -A, bytes)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          size -A target/release/sqler | sort -k2 -n -r > "$tmp"
          head -n 12 "$tmp" >> "$GITHUB_STEP_SUMMARY"
      # cargo-bloat 0.12.1 is on crates.io (verified); install-action has no manifest for it. A failed install only
      # skips the crates table: continue-on-error, no secrets used, permissions stay contents: read.
      # The crates table needs a second full (unstripped) release build, so it runs on push to main and manual
      # dispatch only, not on pull requests.
      - name: Install cargo-bloat
        id: bloat
        if: runner.os == 'Linux' && github.event_name != 'pull_request'
        continue-on-error: true
        run: cargo install cargo-bloat --version 0.12.1 --locked
      - name: Report top crates
        if: runner.os == 'Linux' && github.event_name != 'pull_request' && steps.bloat.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          # Outside target/ so rust-cache does not save a second dependency tree under the shared release key.
          CARGO_TARGET_DIR: ${{ runner.temp }}/bloat
        shell: bash
        run: |
          {
            echo ""
            echo "### Largest crates in .text (cargo bloat --crates)"
            echo "From a separate, unstripped build (strip=none, own target dir outside target/), not the shipped binary above; crate shares are indicative, sizes are larger."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          cargo bloat --release -p sqler-app --locked --crates -n 25 >> "$GITHUB_STEP_SUMMARY"
