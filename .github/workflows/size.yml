name: Binary size

# Reports the release `sqler` size per OS next to the 70 MB budget (ADR-0069). Report only, never a gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pull requests: Linux only (the OS closest to the budget), and only when the shipped binary can change:
  # crates outside `cargo tree -p sqler-app` and tests/benches/markdown are excluded. macOS and Windows run
  # on main, on dispatch and on PRs labelled `full-ci` (read when the run starts; push again after labelling).
  pull_request:
    paths:
      - "crates/**"
      - "!crates/sqler-cli/**"
      - "!crates/sqler-driver-duckdb/**"
      - "!crates/sqler-driver-mssql/**"
      - "!crates/**/tests/**"
      - "!crates/**/benches/**"
      - "!crates/**/*.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "vendor/**"
      - ".github/workflows/size.yml"

# Cancel superseded runs on pull requests only; every main run completes (own group per run).
concurrency:
  group: size-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 3x the slowest observed job (Windows, 1065 s); a hung build must not hold a runner for an hour.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tc-${{ hashFiles('rust-toolchain.toml') }}
          add-rust-environment-hash-key: false
          # Saved on main only; PRs restore (they would otherwise evict main's caches).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build release binary
        run: cargo build --release -p sqler-app --locked
      - name: Save the default binary
        shell: bash
        run: |
          bin=target/release/sqler
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/release/sqler.exe; fi
          cp "$bin" "$RUNNER_TEMP/sqler-default"
      - name: Build release binary with plugin support
        run: cargo build --release -p sqler-app --features plugins --locked
      - name: Report size
        shell: bash
        run: |
          bin=target/release/sqler
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/release/sqler.exe; fi
          off=$(wc -c < "$RUNNER_TEMP/sqler-default" | tr -d ' ')
          on=$(wc -c < "$bin" | tr -d ' ')
          budget=73400320
          reserve=1048576
          limit=$((budget - reserve))
          delta=$((on - off))
          mib() { awk -v b="$1" 'BEGIN { printf "%.1f", b / 1048576 }'; }
          line="sqler release binary on $RUNNER_OS: default $off bytes = $(mib $off) MiB; with --features plugins $on bytes = $(mib $on) MiB; delta $delta bytes (budget 70 MB = $budget; plugins default needs the with-plugins size below $limit)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          echo "plugins_size_ok_$RUNNER_OS=$([ "$on" -lt "$limit" ] && echo yes || echo no)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$off" -gt "$budget" ]; then
            echo "::warning title=Binary size::sqler on $RUNNER_OS is $off bytes ($(mib $off) MiB), over the 70 MB budget"
          fi
          if [ "$on" -ge "$limit" ]; then
            echo "::notice title=Plugins feature::with --features plugins sqler on $RUNNER_OS is $on bytes: plugins stay off by default (ADR-0060 rule: every OS below $limit)"
          fi
      # Diagnostics, report only (never a gate). The release profile strips symbols, so the section table
      # comes from the shipped binary and the per-crate table from a separate unstripped build.
      - name: Report top sections
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          # Sort to a temp file, then head: no pipe to a closing reader, so no SIGPIPE under pipefail.
          # The trap closes the code fence even when a command above fails.
          tmp="$RUNNER_TEMP/sections.txt"
          {
            echo ""
            echo "### Largest sections (size -A, bytes)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          size -A "$RUNNER_TEMP/sqler-default" | sort -k2 -n -r > "$tmp"
          head -n 12 "$tmp" >> "$GITHUB_STEP_SUMMARY"

  # The crates table needs a second full (unstripped) release build (529 s on the Linux size job), so it is its
  # own job: it runs beside `size (ubuntu-latest)` instead of extending it, on push to main and manual dispatch
  # only, never on pull requests. Report only: a failure here does not fail the workflow.
  top-crates:
    name: top crates (ubuntu-latest)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Linux system packages (GPUI build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # cargo-bloat 0.12.1 is on crates.io (verified); install-action has no manifest for it. A failed install only
      # skips the crates table: no secrets used, permissions stay contents: read.
      - name: Install cargo-bloat
        id: bloat
        continue-on-error: true
        run: cargo install cargo-bloat --version 0.12.1 --locked
      - name: Report top crates
        if: steps.bloat.outcome == 'success'
        continue-on-error: true
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
          # Own target dir: the unstripped tree must not mix with the shipped release build. No rust-cache here.
          CARGO_TARGET_DIR: ${{ runner.temp }}/bloat
        shell: bash
        run: |
          {
            echo ""
            echo "### Largest crates in .text (cargo bloat --crates)"
            echo "From a separate, unstripped build (strip=none, own target dir outside target/), not the shipped binary above; crate shares are indicative, sizes are larger."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"' EXIT
          cargo bloat --release -p sqler-app --locked --crates -n 25 >> "$GITHUB_STEP_SUMMARY"
