name: Binary size

# Reports the release `sqler` size per OS next to the 60 MB budget. Report only, never a gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sqler-app/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "vendor/**"
      - ".github/workflows/size.yml"

concurrency:
  group: size-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  size:
    name: size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux system packages (GPUI build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev
      # macOS images may ship Xcode without the separately downloaded Metal toolchain.
      - name: Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
      - name: Build release binary
        run: cargo build --release -p sqler-app --locked
      - name: Report size
        shell: bash
        run: |
          bin=target/release/sqler
          if [ "$RUNNER_OS" = "Windows" ]; then bin=target/release/sqler.exe; fi
          bytes=$(wc -c < "$bin" | tr -d ' ')
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          budget=62914560
          line="sqler release binary on $RUNNER_OS: $bytes bytes = $mib MiB (budget 60 MB = $budget bytes; report only, not a gate)"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt "$budget" ]; then
            echo "::warning title=Binary size::sqler on $RUNNER_OS is $bytes bytes ($mib MiB), over the 60 MB budget"
          fi
