# SPDX-License-Identifier: Apache-2.0
# Throwaway UI-framework spike (ADR-0001). Its own workspace, outside the root one.
[workspace]
resolver = "3"
members = ["gpui-spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["The SQLer Authors"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
