[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["The SQLer Authors"]
publish = false

[workspace.dependencies]
sqler-core = { path = "crates/sqler-core", version = "0.1.0" }
sqler-driver-api = { path = "crates/sqler-driver-api", version = "0.1.0" }
sqler-driver-postgres = { path = "crates/sqler-driver-postgres", version = "0.1.0" }
sqler-driver-mysql = { path = "crates/sqler-driver-mysql", version = "0.1.0" }
sqler-driver-sqlite = { path = "crates/sqler-driver-sqlite", version = "0.1.0" }
sqler-driver-mssql = { path = "crates/sqler-driver-mssql", version = "0.1.0" }
sqler-driver-duckdb = { path = "crates/sqler-driver-duckdb", version = "0.1.0" }
sqler-catalog = { path = "crates/sqler-catalog", version = "0.1.0" }
sqler-sql = { path = "crates/sqler-sql", version = "0.1.0" }
sqler-completion = { path = "crates/sqler-completion", version = "0.1.0" }
sqler-ai-api = { path = "crates/sqler-ai-api", version = "0.1.0" }
sqler-ai-ollama = { path = "crates/sqler-ai-ollama", version = "0.1.0" }
sqler-ai-anthropic = { path = "crates/sqler-ai-anthropic", version = "0.1.0" }
sqler-ai-openai = { path = "crates/sqler-ai-openai", version = "0.1.0" }
sqler-ai-mistral = { path = "crates/sqler-ai-mistral", version = "0.1.0" }
sqler-ai-tools = { path = "crates/sqler-ai-tools", version = "0.1.0" }
sqler-mcp = { path = "crates/sqler-mcp", version = "0.1.0" }
sqler-acp = { path = "crates/sqler-acp", version = "0.1.0" }
sqler-plugin-api = { path = "crates/sqler-plugin-api", version = "0.1.0" }
sqler-plugin-host = { path = "crates/sqler-plugin-host", version = "0.1.0" }
sqler-config = { path = "crates/sqler-config", version = "0.1.0" }
sqler-export = { path = "crates/sqler-export", version = "0.1.0" }
sqler-ui = { path = "crates/sqler-ui", version = "0.1.0" }
sqler-cli = { path = "crates/sqler-cli", version = "0.1.0" }

# external
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
