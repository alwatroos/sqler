[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
authors = ["The SQLer Authors"]
publish = false

[workspace.dependencies]
sqler-core = { path = "crates/sqler-core", version = "0.1.0" }
sqler-driver-api = { path = "crates/sqler-driver-api", version = "0.1.0" }
sqler-driver-postgres = { path = "crates/sqler-driver-postgres", version = "0.1.0" }
sqler-driver-mysql = { path = "crates/sqler-driver-mysql", version = "0.1.0" }
sqler-driver-sqlite = { path = "crates/sqler-driver-sqlite", version = "0.1.0" }
sqler-driver-mssql = { path = "crates/sqler-driver-mssql", version = "0.1.0" }
sqler-driver-duckdb = { path = "crates/sqler-driver-duckdb", version = "0.1.0" }
sqler-catalog = { path = "crates/sqler-catalog", version = "0.1.0" }
sqler-sql = { path = "crates/sqler-sql", version = "0.1.0" }
sqler-completion = { path = "crates/sqler-completion", version = "0.1.0" }
sqler-ai-api = { path = "crates/sqler-ai-api", version = "0.1.0" }
sqler-ai-ollama = { path = "crates/sqler-ai-ollama", version = "0.1.0" }
sqler-ai-anthropic = { path = "crates/sqler-ai-anthropic", version = "0.1.0" }
sqler-ai-openai = { path = "crates/sqler-ai-openai", version = "0.1.0" }
sqler-ai-mistral = { path = "crates/sqler-ai-mistral", version = "0.1.0" }
sqler-ai-tools = { path = "crates/sqler-ai-tools", version = "0.1.0" }
sqler-mcp = { path = "crates/sqler-mcp", version = "0.1.0" }
sqler-acp = { path = "crates/sqler-acp", version = "0.1.0" }
sqler-plugin-api = { path = "crates/sqler-plugin-api", version = "0.1.0" }
sqler-plugin-host = { path = "crates/sqler-plugin-host", version = "0.1.0" }
sqler-config = { path = "crates/sqler-config", version = "0.1.0" }
sqler-tunnel = { path = "crates/sqler-tunnel", version = "0.1.0" }
sqler-export = { path = "crates/sqler-export", version = "0.1.0", default-features = false }
sqler-ui = { path = "crates/sqler-ui", version = "0.1.0" }
sqler-cli = { path = "crates/sqler-cli", version = "0.1.0" }
sqler-update = { path = "crates/sqler-update", version = "0.1.0" }

# external
thiserror = "2.0.21"
insta = { version = "1.49.0", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
futures-core = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.1", default-features = false }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
# Plugin manifest hash (P2, ADR-0056): the newest line, 0.11, already in Cargo.lock; no default features (no std needed).
sha2 = { version = "0.11.1", default-features = false }
# Plugin manifest version (P2): the line already in Cargo.lock.
semver = "1.0.28"
serde_json = "1.0.154"
keyring = { version = "4.2.0", default-features = false }
russh = { version = "0.64.1", default-features = false, features = ["ring"] }
rand = "0.10.3"
duckdb = { version = "1.20000.0", default-features = false, features = ["bundled"] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = ["aws-lc-rs"] }
aws-lc-sys = { version = "0.46.0", default-features = false }
ring = "0.17.14"
crypto-bigint = { version = "0.7.5", default-features = false, features = ["alloc"] }
pem-rfc7468 = { version = "1.0.0", default-features = false, features = ["alloc"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }
agent-client-protocol = "3.4.0"
tokio-util = { version = "0.7.20", default-features = false, features = ["compat"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["net"] }
# SQL Server (ADR-0054, P16): tiberius without its defaults (native-tls, winauth: no OpenSSL, no Windows auth);
# only TDS 7.3 and rustls. No chrono/time/decimal features: dates and decimals are decoded from the raw fields.
# tiberius' rustls feature pulls tokio-rustls with its default (aws-lc-rs) provider, which is already in the lock
# for sqlx-mysql (ADR-0018); the driver installs ring as the process default provider, so there is one TLS stack.
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls"] }
# Direct dependency only to select the ring provider for tiberius' TLS (the same stack as sqlx and reqwest).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }
flate2 = "1.1.10"
calamine = { version = "0.37.0", default-features = false }
memory-stats = "1.2.0"
bytes = "1.12.1"
# HTTP client of the AI providers (T3): the 0.12 line on the rustls/ring/native-roots stack already in Cargo.lock
# (hyper-rustls 0.27, rustls 0.23); no default-tls (OpenSSL), no webpki-roots, no aws-lc provider. 0.13 would add both.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots"] }
# Same 0.22 line reqwest 0.12 uses, so Cargo.lock keeps one base64; the newest line is 0.23.1.
base64 = "0.22.1"
# Dev only (T4): capture log and tracing output in the secret-redaction test; both are already in Cargo.lock.
log = "0.4.34"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# sqler-mcp (T15, ADR-0040): the HTTP front service. `rmcp` 3.6.0 was measured and rejected (+2.39 MiB, over the 1.5 MiB
# gate), so the MCP protocol layer is in-crate; these are the versions already in Cargo.lock through reqwest.
hyper = { version = "1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "0.1.5"
http = "1.5.0"
subtle = "2.6.1"
gpui-component = { version = "0.8.0", features = ["tree-sitter-sql"] }
# Lucide icon assets (ADR-0044); pinned to the version gpui-component 0.8.0 resolves.
gpui-kit-assets = "=0.8.0"
# Same 0.97 line as gpui-component 0.8.0 (its CompletionProvider/HoverProvider speak these types); AGENTS.md section 10.
lsp-types = "0.97.0"
gpui = { version = "=0.3.9", package = "gpui-pre" }
# Dev only: PNG encode and downscale in the screenshot harness (already in the lockfile through gpui-pre).
image = { version = "0.25.10", default-features = false, features = ["png"] }
gpui_platform = { version = "=0.3.9", package = "gpui-pre-platform", features = ["font-kit", "x11", "wayland"] }
# Dev only (P2, ADR-0055): parses the plugin WIT package in a test (`decoding` is what enables `Resolve::push_dir`). Latest release, not yanked, Apache-2.0 WITH
# LLVM-exception OR Apache-2.0 OR MIT (verified live on crates.io 2026-10-22).
wit-parser = { version = "0.262.0", default-features = false, features = ["decoding"] }

# Plugin host runtime (P4, ADR-0057): wasmtime 50.0.0, the newest non-yanked release (crates.io, 2026-10-22). All three crates
# share the version; features are picked per crate. wasmtime-wasi-http has its default sender (tokio-rustls, webpki-roots,
# CDLA-Permissive-2.0) switched off: egress goes through the host's own `Egress` trait.
wasmtime = { version = "50.0.0", default-features = false }
wasmtime-wasi = { version = "50.0.0", default-features = false }
wasmtime-wasi-http = { version = "50.0.0", default-features = false }
# Dev only (P4): WAT text for the test components; the line wasmtime 50 resolves.
wat = "1.262.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

# ADR-0018: sqlx-mysql 0.9.0 with an aws-lc-rs backend for the MySQL RSA password exchange
# (the upstream `rsa` backend is banned, RUSTSEC-2023-0071). 56-line diff in 4 files, see vendor/sqlx-mysql/README.md.
[patch.crates-io]
sqlx-mysql = { path = "vendor/sqlx-mysql" }

# T14: the Linux release binary kept its ELF symbol table (.symtab + .strtab, about 23 MB of 78 MB on aarch64) and
# was split over 16 codegen units. `strip = "symbols"` drops the table with no runtime effect (a panic backtrace
# prints addresses instead of function names); `codegen-units = 1` lets the inliner see whole crates (about 9 MB
# smaller, release build about 1.7x slower). Unstripped build for debugging:
# `CARGO_PROFILE_RELEASE_STRIP=none cargo build --release -p sqler-app`. `bench` inherits `release`.
# Rejected: LTO (thin grew the binary, fat was killed by the OOM killer in 7.7 GB) and `panic = "abort"` (changes
# failure behaviour); see docs/src/benchmarks.md.
[profile.release]
strip = "symbols"
codegen-units = 1
