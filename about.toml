# cargo-about configuration (cargo-about 0.9.2). Used by .github/scripts/third-party-licenses.sh (R14, ADR-0064).
#
# The accepted licences mirror [licenses].allow of deny.toml, in the same order. Adding one needs an ADR first.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The five release targets of dist-workspace.toml: the report covers their union.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace crates are the product itself (Apache-2.0, LICENSE).
private = { ignore = true }

# Per-crate MPL-2.0 (file-level copyleft, used unmodified; deny.toml has the same exceptions). cbindgen is
# build-only, so it has no entry. cargo-about lists dwrote although `cargo tree --target <triple>` finds it for none of
# the five targets (it is in `--target all` only); over-listing is harmless.
dwrote = { accepted = ["MPL-2.0"] }
option-ext = { accepted = ["MPL-2.0"] }
