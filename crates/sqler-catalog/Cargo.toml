[package]
name = "sqler-catalog"
description = "Schema cache with incremental refresh, search index and dependency graph."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-driver-api.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
sqler-driver-sqlite.workspace = true
tokio = { workspace = true, features = ["rt"] }

[[bench]]
name = "catalog_tree"
harness = false

[[bench]]
name = "catalog_index"
harness = false
