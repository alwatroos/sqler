[package]
name = "sqler-cli"
description = "Headless command-line interface: run a query, export results and start the MCP server. Proves the core is UI-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[[bin]]
name = "sqler-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["driver-sqlite", "driver-postgres", "driver-mysql"]
driver-sqlite = ["dep:sqler-driver-sqlite"]
driver-postgres = ["dep:sqler-driver-postgres"]
driver-mysql = ["dep:sqler-driver-mysql"]
# Plugin drivers (ADR-0061; off by default, ADR-0054): the wasmtime host with the Cranelift compiler and the HTTP
# egress. Plugins come from `<config>/plugins` only; stored grants are honoured, nothing is ever prompted.
plugins = ["dep:sqler-plugin-api", "dep:sqler-plugin-host", "sqler-plugin-host/cl", "sqler-plugin-host/net"]

[dependencies]
sqler-driver-api.workspace = true
sqler-export.workspace = true
sqler-sql.workspace = true
sqler-mcp.workspace = true
sqler-ai-tools.workspace = true
sqler-ai-api.workspace = true
sqler-catalog.workspace = true
sqler-config.workspace = true
sqler-driver-sqlite = { workspace = true, optional = true }
sqler-driver-postgres = { workspace = true, optional = true }
sqler-driver-mysql = { workspace = true, optional = true }
sqler-plugin-api = { workspace = true, optional = true }
sqler-plugin-host = { workspace = true, optional = true }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "signal", "macros", "sync"] }

[dev-dependencies]
serde_json.workspace = true
