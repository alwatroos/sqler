[package]
name = "sqler-cli"
description = "Headless command-line interface: run a query, export results and start the MCP server. Proves the core is UI-independent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[[bin]]
name = "sqler-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["driver-sqlite", "driver-postgres", "driver-mysql"]
driver-sqlite = ["dep:sqler-driver-sqlite"]
driver-postgres = ["dep:sqler-driver-postgres"]
driver-mysql = ["dep:sqler-driver-mysql"]

[dependencies]
sqler-driver-api.workspace = true
sqler-export.workspace = true
sqler-sql.workspace = true
# Only for `redact_credentials` (echo of a write statement).
sqler-config.workspace = true
sqler-driver-sqlite = { workspace = true, optional = true }
sqler-driver-postgres = { workspace = true, optional = true }
sqler-driver-mysql = { workspace = true, optional = true }
anyhow.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "macros"] }
