[package]
name = "sqler-ui"
description = "The GPUI application: workspace, tabs, panels, grid, editor, command palette and themes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
# GPUI views. Off by default so `cargo test -p sqler-ui` never builds GPUI; `sqler-app` turns it on.
gui = ["dep:gpui-component", "dep:gpui", "dep:gpui_platform", "dep:lsp-types"]

[dependencies]
sqler-catalog.workspace = true
sqler-completion.workspace = true
sqler-config.workspace = true
sqler-driver-api.workspace = true
sqler-export.workspace = true
sqler-sql.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
gpui-component = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
sqler-driver-sqlite.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }

[[bench]]
name = "grid_viewport"
harness = false

[[bench]]
name = "grid_copy"
harness = false

[[bench]]
name = "grid_sort"
harness = false

[[bench]]
name = "browser_tree"
harness = false

[[bench]]
name = "editor_buffer"
harness = false

[[bench]]
name = "editor_intellisense"
harness = false
