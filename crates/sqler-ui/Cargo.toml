[package]
name = "sqler-ui"
description = "The GPUI application: workspace, tabs, panels, grid, editor, command palette and themes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
# GPUI views. Off by default so `cargo test -p sqler-ui` never builds GPUI; `sqler-app` turns it on.
gui = ["dep:gpui-component", "dep:gpui", "dep:gpui_platform", "dep:lsp-types", "dep:gpui-kit-assets"]
# The headless screenshot harness (`tests/screenshots.rs`, `workspace::scene`); never part of the app.
screenshots = ["gui", "gpui/test-support", "gpui_platform/test-support", "sqler-ai-api/test-support"]

[dependencies]
sqler-ai-api.workspace = true
sqler-ai-tools.workspace = true
sqler-acp.workspace = true
sqler-catalog.workspace = true
sqler-completion.workspace = true
sqler-config.workspace = true
sqler-driver-api.workspace = true
sqler-plugin-api.workspace = true
sqler-export.workspace = true
sqler-mcp.workspace = true
sqler-sql.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
gpui-component = { workspace = true, optional = true }
gpui = { workspace = true, optional = true }
gpui-kit-assets = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
lsp-types = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
sqler-ai-api = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
sqler-driver-mysql.workspace = true
sqler-driver-postgres.workspace = true
sqler-driver-sqlite.workspace = true
sqler-export = { workspace = true, features = ["parquet", "xlsx"] }
serde_json.workspace = true
insta.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net"] }
image.workspace = true
# The agent tests and the guard suite talk to the loopback MCP endpoint with a plain HTTP client.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true
http.workspace = true
bytes.workspace = true

[[bench]]
name = "grid_viewport"
harness = false

[[bench]]
name = "grid_copy"
harness = false

[[bench]]
name = "grid_sort"
harness = false

[[bench]]
name = "browser_tree"
harness = false

[[bench]]
name = "editor_buffer"
harness = false

[[bench]]
name = "editor_intellisense"
harness = false

[[bench]]
name = "grid_export"
harness = false

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false
required-features = ["screenshots"]
