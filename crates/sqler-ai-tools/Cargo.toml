[package]
name = "sqler-ai-tools"
description = "The tool set exposed to models: list_schemas, describe_table, run_query (guarded), search_data, explain and more."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-core.workspace = true
sqler-ai-api.workspace = true
sqler-catalog.workspace = true
sqler-driver-api.workspace = true
sqler-sql.workspace = true
sqler-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
sqler-driver-sqlite.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }
proptest.workspace = true
insta.workspace = true
sqler-ai-api = { workspace = true, features = ["test-support"] }
