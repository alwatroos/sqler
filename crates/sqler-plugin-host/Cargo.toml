[package]
name = "sqler-plugin-host"
description = "Plugin loading, sandboxing, capability grants and lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[features]
# Default: the engine-free core (discovery, manifest checks, digest and grant key, fs scopes, traits). No wasmtime.
default = []
# Internal: everything the wasmtime runtime layer needs.
runtime = [
    "dep:wasmtime",
    "dep:wasmtime-wasi",
    "dep:wasmtime-wasi-http",
    "dep:tokio",
    "dep:tokio-util",
    "dep:http-body-util",
    "dep:sqler-sql",
    "dep:sqler-catalog",
    "dep:sqler-driver-api",
    "tokio/rt",
    "tokio/time",
    "tokio/sync",
    "tokio/macros",
    "wasmtime/runtime",
    "wasmtime/component-model",
    "wasmtime/async",
    "wasmtime/std",
    "wasmtime-wasi/p2",
    "wasmtime-wasi-http/p2",
]
# Cranelift JIT: components are compiled in-process.
cl = ["runtime", "wasmtime/cranelift"]
# Pulley interpreter: compiles and links, but loading precompiled components is P7's decision (`NoCompiler`).
pulley-rt = ["runtime", "wasmtime/pulley"]
# Outgoing HTTP with the existing reqwest/rustls (ring) client.
net = ["dep:reqwest", "dep:tokio", "tokio/net", "tokio/time"]

[dependencies]
sqler-plugin-api.workspace = true
thiserror.workspace = true
tracing.workspace = true
http.workspace = true
bytes.workspace = true
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wasmtime-wasi-http = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
# Bodies of the wasi-http send hook (buffered request, boxed response).
http-body-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
# Query and catalog host interfaces (runtime only): classification, the catalog cache, sessions and core types.
sqler-sql = { workspace = true, optional = true }
sqler-catalog = { workspace = true, optional = true }
sqler-driver-api = { workspace = true, optional = true }

[dev-dependencies]
sqler-driver-sqlite.workspace = true
proptest.workspace = true
wat.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net"] }
