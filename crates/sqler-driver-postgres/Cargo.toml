[package]
name = "sqler-driver-postgres"
description = "PostgreSQL driver implementation built on sqlx."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-driver-api.workspace = true
futures-core.workspace = true
sqlx = { workspace = true, features = ["postgres", "tls-rustls-ring-native-roots"] }
tokio = { workspace = true, features = ["time", "net", "io-util", "rt"] }

[dev-dependencies]
sqler-sql.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util"] }
