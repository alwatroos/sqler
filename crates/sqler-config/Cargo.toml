[package]
name = "sqler-config"
description = "Settings, keybindings, connection store and keychain access."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-core.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true

# T5 (M2): keyring 4.x ships its native stores behind the `v1` feature, gated per target:
# macOS Keychain, Windows Credential Manager, Secret Service over pure-Rust zbus elsewhere on unix.
# No keyutils, no vendored libdbus, no mock store (ADR-0012).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux", target_os = "freebsd"))'.dependencies]
keyring = { workspace = true, features = ["v1"] }
