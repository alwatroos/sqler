[package]
name = "sqler-driver-mysql"
description = "MySQL driver implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-driver-api.workspace = true
sqlx = { workspace = true, features = ["mysql", "tls-rustls-ring-native-roots"] }
# ADR-0018: the MySQL RSA password exchange runs on aws-lc-rs through the vendored sqlx-mysql
# patch (root `[patch.crates-io]`); the upstream `rsa` crate stays banned in deny.toml.
sqlx-mysql.workspace = true
futures-core.workspace = true
tokio = { workspace = true, features = ["time", "net", "io-util", "rt"] }

[dev-dependencies]
sqler-sql.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "macros"] }

# aws-lc-sys on x86_64 Windows needs NASM; the prebuilt objects avoid a tool-install step in CI.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aws-lc-sys = { workspace = true, features = ["prebuilt-nasm"] }
