[package]
name = "sqler-driver-mysql"
description = "MySQL driver implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"

[lints]
workspace = true

[dependencies]
sqler-driver-api.workspace = true
sqlx = { workspace = true, features = ["mysql", "tls-rustls-ring-native-roots"] }
futures-core.workspace = true
tokio = { workspace = true, features = ["time", "net", "io-util", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "macros"] }
