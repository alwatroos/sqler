[package]
name = "sqler-app"
description = "The SQLer desktop application: the `sqler` binary that wires config, drivers and the GPUI UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
readme = "README.md"
repository = "https://github.com/alwatroos/sqler"

# ADR-0064: cargo-dist ships this package only (`publish = false` packages are skipped unless `dist = true`).
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "4FA55639-5F51-404D-BFA5-92C365E9AF82"
path-guid = "55BC8E55-35A1-499A-9287-D304C7A5D5F9"
license = false
eula = false

[[bin]]
name = "sqler"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = [
    "driver-sqlite",
    "driver-postgres",
    "driver-mysql",
    "export-xlsx",
    "export-parquet",
    "ai-ollama",
    "ai-anthropic",
    "ai-openai",
    "ai-mistral",
    "update",
]
driver-sqlite = ["dep:sqler-driver-sqlite"]
driver-postgres = ["dep:sqler-driver-postgres"]
driver-mysql = ["dep:sqler-driver-mysql"]
export-xlsx = ["dep:sqler-export", "sqler-export/xlsx"]
export-parquet = ["dep:sqler-export", "sqler-export/parquet"]
ai-ollama = ["dep:sqler-ai-ollama"]
ai-anthropic = ["dep:sqler-ai-anthropic"]
ai-openai = ["dep:sqler-ai-openai"]
ai-mistral = ["dep:sqler-ai-mistral"]
# The opt-in update check (ADR-0066): the check-only client with its signed manifest. Nothing runs unless the user
# turns `check_for_updates` on; without the feature the settings page says the build has no update checks.
update = ["dep:sqler-update", "dep:semver"]
# Plugins (ADR-0060; off by default, ADR-0054): the wasmtime host with the Cranelift compiler (`cl`, loads plain
# `.wasm`) and the HTTP egress (`net`).
plugins = ["dep:sqler-plugin-api", "dep:sqler-plugin-host", "dep:sqler-catalog", "dep:sqler-ai-tools", "dep:serde_json", "sqler-plugin-host/cl", "sqler-plugin-host/net"]
# The native `DuckDB` engine behind the host-kind plugin `duckdb` (ADR-0070; off by default: it compiles the bundled C++ engine).
driver-duckdb = ["plugins", "dep:sqler-driver-duckdb"]
# SQL Server (ADR-0071; off by default): the native engine behind the `sqlserver` plugin (`driver.host:mssql`).
driver-mssql = ["plugins", "dep:sqler-driver-mssql"]

[dependencies]
sqler-ui = { workspace = true, features = ["gui"] }
sqler-ai-api.workspace = true
sqler-config.workspace = true
sqler-driver-api.workspace = true
sqler-tunnel.workspace = true
sqler-driver-sqlite = { workspace = true, optional = true }
sqler-driver-postgres = { workspace = true, optional = true }
sqler-driver-mysql = { workspace = true, optional = true }
sqler-driver-duckdb = { workspace = true, optional = true }
sqler-driver-mssql = { workspace = true, optional = true }
sqler-export = { workspace = true, optional = true }
sqler-ai-ollama = { workspace = true, optional = true }
sqler-ai-anthropic = { workspace = true, optional = true }
sqler-ai-openai = { workspace = true, optional = true }
sqler-ai-mistral = { workspace = true, optional = true }
sqler-plugin-api = { workspace = true, optional = true }
sqler-plugin-host = { workspace = true, optional = true }
sqler-catalog = { workspace = true, optional = true }
sqler-ai-tools = { workspace = true, optional = true }
sqler-update = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }

[dev-dependencies]
sqler-sql.workspace = true
tokio = { workspace = true, features = ["macros", "time", "net", "io-util", "rt"] }
# For the update mock server (`sqler-update/tests/support`, included by path) and its TEST ONLY signing helpers.
ring.workspace = true
base64.workspace = true
serde_json.workspace = true
