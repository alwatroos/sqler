# SPDX-License-Identifier: Apache-2.0
[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63.0"

# A workspace of its own, so the crate builds wherever it is generated.
[workspace]

# `deny`, not `forbid`: the wit-bindgen glue needs a local `allow`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[profile.release]
strip = "symbols"
codegen-units = 1
opt-level = "s"
lto = true
