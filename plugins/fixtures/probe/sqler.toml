# The host tests (crates/sqler-plugin-host/tests/guests.rs) drive every command and status item below.
[plugin]
id = "probe"
name = "Probe"
version = "0.1.0"
api = "0.1.0"
description = "Test fixture: misbehaves on command and reports what the sandbox exposes."
capabilities = ["db.read", "db.write", "ui.panel", "fs.read:data", "fs.read:plugin"]

[entry]
component = "probe.wasm"

[[commands]]
id = "ok"
title = "OK"

[[commands]]
id = "spin"
title = "Spin"

[[commands]]
id = "alloc"
title = "Allocate until the memory cap"

[[commands]]
id = "panic"
title = "Panic"

[[commands]]
id = "trap"
title = "Trap"

[[commands]]
id = "sleep"
title = "Sleep for an hour"

[[commands]]
id = "log-flood"
title = "Write 1000 log lines"

[[commands]]
id = "ui-calls"
title = "Push 100 status texts, 10 notifications and one panel refresh"

[[commands]]
id = "context"
title = "Fail with a description of the command context"

[[commands]]
id = "unknown"
title = "Declared, but the guest does not know it"

[[panels]]
id = "tree"
title = "Tree"

[[panels]]
id = "bad-tree"
title = "Bad tree"

[[status-items]]
id = "env"

[[status-items]]
id = "read-data"

[[status-items]]
id = "read-plugin"

[[status-items]]
id = "read-escape"

[[status-items]]
id = "read-link"

[[status-items]]
id = "read-linkdir"

[[status-items]]
id = "read-root"

[[status-items]]
id = "setting"

[[status-items]]
id = "http"

[[status-items]]
id = "http-other"

[[status-items]]
id = "query"

[[status-items]]
id = "query-one"

[[status-items]]
id = "catalog"

[[status-items]]
id = "columns"

[[settings]]
key = "url"
label = "URL the http status items fetch"
default = ""

[[settings]]
key = "connection"
label = "Connection id the query and catalog status items use"
default = ""

[[settings]]
key = "sql"
label = "SQL text the query status items run"
default = ""

[[settings]]
key = "table"
label = "Table the columns status item describes"
default = ""
