# cargo-deny configuration (cargo-deny 0.20.2). Run: cargo deny check
#
# The license allow-list is ASF Category A (permissive licenses compatible with Apache-2.0).
# Adding a license needs an ADR first.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are `publish = false`.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
