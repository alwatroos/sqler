[workspace]
members = ["cargo:."]

# Release pipeline (ADR-0064). cargo-dist builds, packages and, on a `v*` tag only, publishes `sqler-app`.
# `.github/workflows/release.yml` is maintained by hand (allow-dirty); see the ADR before re-running `dist generate`.
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
create-release = true
installers = ["shell", "powershell", "msi"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
checksum = "sha256"
# Build `--package sqler-app` only; a workspace build would compile the DuckDB C++ engine (ADR-0070).
precise-builds = true
pr-run-mode = "upload"
# release.yml is hand-maintained (path-gated PR trigger, DuckDB guard steps, GPUI setup); do not regenerate it blindly.
# crates/sqler-app/wix/main.wxs is hand-edited (licence sidecar files in the MSI, R14), hence "msi".
allow-dirty = ["ci", "msi"]
install-path = "~/.sqler/bin"
install-updater = false
# release.yml runs cargo-cyclonedx itself (one SBOM per target, sqler-app_<triple>.cdx.xml); dist would register a release-wide file that is never produced.
cargo-cyclonedx = false
github-attestations = false
# THE release feature set, one line: release set per owner decision 12 (ADR-0064 amendment).
# `.github/scripts/release-guard.sh features` rejects `driver-duckdb` whatever else the line holds.
features = ["plugins", "driver-mssql"]
# Licence files in every archive (R14): the generated THIRD-PARTY-LICENSES.txt (release.yml, plan job) and the static ones.
include = ["NOTICE", "THIRD-PARTY-LICENSES.txt", "licenses"]
